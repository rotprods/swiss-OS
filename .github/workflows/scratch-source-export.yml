name: scratch-source-export

on:
  push:
    branches:
      - scratch/token14-source-export

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Package Git history only
        run: tar -czf /tmp/swiss-os-git-history.tgz .git
      - name: Upload Git history artifact
        uses: actions/upload-artifact@v4
        with:
          name: swiss-os-git-history-${{ github.sha }}
          path: /tmp/swiss-os-git-history.tgz
          retention-days: 1

name: scratch-token14-release-builder

on:
  push:
    branches:
      - scratch/token14-source-export
    paths:
      - .scratch/launch-token14-release

permissions:
  contents: write

jobs:
  build-release-ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Assemble and publish exact validated release tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, urllib.error, urllib.request
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']; token = os.environ['GH_TOKEN']; api = 'https://api.github.com'
          parent = '2e251eed1080c13bf01b3f89316167338d0c1755'; base_tree = '99d8f7609bbb21ef437b232edac1c935cd622fe3'
          expected_runtime_blob = '28415ea304b9809284623f5afcc9bbea972907d6'; expected_tree = '654299455a1dd711bf1fbdf1236e5064c47880b8'
          branch = 'fix/token14-postmerge-release'
          b64 = ''.join(p.read_text().strip() for p in sorted(Path('.scratch').glob('runtime_graph.b64.part*')))
          raw = base64.b64decode(b64, validate=True)
          computed_blob = hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest()
          if computed_blob != expected_runtime_blob: raise SystemExit(f'runtime blob mismatch: {computed_blob}')
          def request(method, path, payload=None, allow_404=False):
              data = None if payload is None else json.dumps(payload, separators=(',', ':')).encode()
              req = urllib.request.Request(api + path, data=data, method=method)
              for k,v in {'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'swiss-os-token14-release-builder'}.items(): req.add_header(k,v)
              try:
                  with urllib.request.urlopen(req) as r: return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  if allow_404 and e.code == 404: return None
                  raise RuntimeError(f'{method} {path} -> {e.code}: {e.read().decode()}') from e
          blob = request('POST', f'/repos/{repo}/git/blobs', {'content':base64.b64encode(raw).decode(),'encoding':'base64'})
          if blob['sha'] != expected_runtime_blob: raise SystemExit(f'GitHub runtime blob mismatch: {blob["sha"]}')
          elements = [
            ('docs/continuity/CONTEXT_SURVIVAL.json','7b264d643799f6d70ab8bf8f704a74a0d67edd2e'),
            ('docs/refactor-v2/coordination_current_config.json','d3b45bfd784bff2f136d7114cdfcef97c9f9eafb'),
            ('docs/state/NEXT.json','4dda694f4a0b8a2ba82b8efd394e8fc3928c524b'),
            ('docs/state/agent-runtime/heartbeats/HB-AGENT-GPT56SOL-GRAPHV2-001-SES-014-085500-COMPLETE.json','d633793afc746bf7f46f5a1a34f0e23896767992'),
            ('docs/state/agent-runtime/runtime-graph.json',expected_runtime_blob),
            ('docs/state/v2/active-claims.json','8deb99ea947e89a907ec608b543b3f45ae4f7cef'),
            ('docs/state/v2/claims/CLAIM-GRAPHV2-PLATFORM-TRUTH-014.json','8e96d8b0ac813313cdac62e17b3e23785df309a9'),
            ('docs/state/v2/context-pack.json','b65186ce1b8da6b7656b0b97c320e64c50b053ca'),
            ('docs/state/v2/events/EVT-20260902T085500Z-GRAPHV2-TOKEN14-CLAIM-RELEASED.json','da2114bbe3e74c86007421df59e556be16d8428b'),
            ('docs/state/v2/graph-snapshot.json','cb288ad20b3051c1bc9f79e87abfced82341e68c'),
            ('docs/state/v2/project-state.json','153c9d429fcafc52afaf79937bff0a53cbe6c034')]
          tree = request('POST', f'/repos/{repo}/git/trees', {'base_tree':base_tree,'tree':[{'path':p,'mode':'100644','type':'blob','sha':s} for p,s in elements]})
          if tree['sha'] != expected_tree: raise SystemExit(f'tree mismatch: {tree["sha"]} != {expected_tree}')
          commit = request('POST', f'/repos/{repo}/git/commits', {'message':'coord: release token14 after platform truth merge','tree':tree['sha'],'parents':[parent]})
          existing = request('GET', f'/repos/{repo}/git/ref/heads/{branch}', allow_404=True)
          if existing:
              if existing['object']['sha'] != commit['sha']: raise SystemExit(f'{branch} exists at unexpected {existing["object"]["sha"]}')
          else: request('POST', f'/repos/{repo}/git/refs', {'ref':f'refs/heads/{branch}','sha':commit['sha']})
          print(json.dumps({'runtime_blob':blob['sha'],'tree':tree['sha'],'commit':commit['sha'],'branch':branch},sort_keys=True))
          PY

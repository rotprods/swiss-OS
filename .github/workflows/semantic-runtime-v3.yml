name: semantic-runtime-v3-projection-sync

on:
  push:
    branches:
      - feat/semantic-runtime-v3-token18
    paths:
      - .github/workflows/semantic-runtime-v3.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Finalize semantic V3 coordination truth
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('docs/refactor-v2/coordination_current_config.json')
          data = json.loads(path.read_text())
          helper = '.github/workflows/semantic-runtime-v3.yml'
          data['relevant_paths'] = [p for p in data['relevant_paths'] if p != helper]
          data['state'] = 'SEMANTIC_RUNTIME_V3_TOKEN18_RELEASED_PROJECTIONS_SYNCED'
          done = 'Deterministic Agent Runtime Graph and V2 coordination rebuilds passed from terminal token18 evidence with active_claims=[] and fencing_high_watermark=18.'
          verified = list(data.get('verified_work', []))
          if done not in verified:
              verified.append(done)
          data['verified_work'] = verified
          data['unverified_work'] = [x for x in data.get('unverified_work', []) if not x.startswith('Deterministic Agent Runtime Graph') and not x.startswith('Deterministic V2 coordination projections')]
          data['next_safe_actions'] = [x for x in data.get('next_safe_actions', []) if not x.startswith('Rebuild deterministic Agent Runtime Graph') and not x.startswith('Rebuild V2 coordination')]
          finding = 'Terminal token18 projections are synchronized: lifecycle revision b01341474d160b2cebc7b602a300c855f67e0bb0e80fbd324613852a22717944, zero active claims, fencing high-watermark 18.'
          findings = list(data.get('liveness_findings', []))
          if finding not in findings:
              findings.append(finding)
          data['liveness_findings'] = findings
          path.write_text(json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n')
          PY
      - name: Rebuild exact terminal projections
        run: |
          set -euo pipefail
          AS_OF=$(python - <<'PY'
          import json
          from pathlib import Path
          values=[]
          for path in Path('docs/state/agent-runtime/heartbeats').glob('*.json'):
              data=json.loads(path.read_text())
              value=data.get('observed_at')
              if isinstance(value,str) and value:
                  values.append(value)
          print(max(values) if values else '1970-01-01T00:00:00Z')
          PY
          )
          python scripts/rebuild_agent_runtime_graph.py --as-of "$AS_OF" --output docs/state/agent-runtime/runtime-graph.json
          rm -rf /tmp/v2-coordination-sync /tmp/v2-coordination-check
          python scripts/rebuild_v2_coordination.py --config docs/refactor-v2/coordination_current_config.json --output-dir /tmp/v2-coordination-sync
          cp /tmp/v2-coordination-sync/active-claims.json docs/state/v2/active-claims.json
          cp /tmp/v2-coordination-sync/project-state.json docs/state/v2/project-state.json
          cp /tmp/v2-coordination-sync/context-pack.json docs/state/v2/context-pack.json
          cp /tmp/v2-coordination-sync/graph-snapshot.json docs/state/v2/graph-snapshot.json
          cp /tmp/v2-coordination-sync/CONTEXT_SURVIVAL.json docs/continuity/CONTEXT_SURVIVAL.json
          python scripts/rebuild_agent_runtime_graph.py --check
          python scripts/rebuild_v2_coordination.py --config docs/refactor-v2/coordination_current_config.json --output-dir /tmp/v2-coordination-check --check
          git diff --check
      - name: Commit only config and deterministic generated state
        run: |
          set -euo pipefail
          git config user.name 'swiss-os-projection-bot'
          git config user.email '261643698+rotprods@users.noreply.github.com'
          git add docs/refactor-v2/coordination_current_config.json \
                  docs/state/agent-runtime/runtime-graph.json \
                  docs/state/v2/active-claims.json \
                  docs/state/v2/project-state.json \
                  docs/state/v2/context-pack.json \
                  docs/state/v2/graph-snapshot.json \
                  docs/continuity/CONTEXT_SURVIVAL.json
          git commit -m 'chore: finalize token18 deterministic projections [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}

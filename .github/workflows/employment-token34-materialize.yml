name: employment-token34-terminal-projections

on:
  push:
    branches: [employment/live-vacancy-packets-token34-20260921]
    paths:
      - 'docs/state/agent-runtime/heartbeats/HB-AGENT-GPT56SOL-SWARM-038-COMPLETE.json'
      - 'docs/reports/employment/TOKEN34_TERMINAL_RELEASE_READBACK_2026-09-21.json'

permissions:
  contents: write

concurrency:
  group: employment-token34-terminal-projections
  cancel-in-progress: false

jobs:
  terminalize:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Require zero-claim plus released external lease parity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/execution_lease_live_guard.py --receipt /tmp/execution-lease-token34-terminal.json
      - name: Finalize employment token34 semantics
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          main='98882fa96a1a87a43580e839d9aba292d9028d14'
          branch='employment/live-vacancy-packets-token34-20260921'
          active_hb='docs/state/agent-runtime/heartbeats/HB-AGENT-GPT56SOL-SWARM-038-124600.json'
          complete_hb='docs/state/agent-runtime/heartbeats/HB-AGENT-GPT56SOL-SWARM-038-COMPLETE.json'
          iteration='docs/state/agent-runtime/iterations/ITER-employment-live-vacancy-token34.json'
          release_event='docs/state/v2/events/EVT-20260921T132000Z-EMPLOYMENT-TOKEN34-CLAIM-RELEASED.json'
          report='docs/reports/employment/TOKEN34_TERMINAL_RELEASE_READBACK_2026-09-21.json'
          frontier='docs/state/employment/LIVE_OPPORTUNITY_FRONTIER_2026-09-21.json'
          evidence=json.loads(Path(report).read_text())

          p=Path('docs/refactor-v2/coordination_current_config.json')
          d=json.loads(p.read_text())
          d['base_main_sha']=main
          d['branch']=branch
          d['generated_at']=evidence['recorded_at']
          d['state']='EMPLOYMENT_TOKEN34_TERMINAL_LIVE_VACANCY_PACKETS_NO_SEND_ZERO_WRITER'
          d['open_prs']=[475]
          d['blockers']=[
            'APPLICATION_SUBMISSION remains excluded from token34 and OUTBOUND remains CLOSED.',
            'CRM_UNIVERSE_COMPLETE remains false at RECONCILE_REQUIRED=1403.',
            'Mandarin Oriental and The Alpina require English readiness self-verification before any future send authorization.',
            'Lenkerhof has an unverified housekeeping-experience gap.',
            'juhui Flumserberg requires first-party/employer-controlled vacancy revalidation.'
          ]
          d['next_safe_actions']=[
            'Verify zero active claims and zero active runtime sessions with fencing high-watermark34.',
            'Run final exact-head terminal repo-guard on the public-safe opportunity frontier.',
            'Promote only the exact qualified head and require exact-main repo-guard.',
            'Exit token34 authority. Any future application submission requires a separately eligible outbound claim and explicit governing authorization.'
          ]
          d['liveness_findings']=[
            'Token34 exact-head active repo-guard 35603945572 / #4541 passed every declared gate.',
            'Four private vacancy-specific packets are compiled NO-SEND and the public-safe opportunity frontier persists five current targets.',
            'Claim34 RELEASED before external lease release; COMPLETE was withheld during the two-surface gap.',
            'External lease34 was CAS-released and read back active_lease=null, last_lease token34 RELEASED, watermark34.',
            'Heartbeat34 COMPLETE was published only after external release readback.',
            'Operational CRM authority remains E4/690 with H-0691 unallocated and OUTBOUND CLOSED.'
          ]
          refs=[]
          for v in d.get('source_refs',[]):
              if not isinstance(v,str):
                  continue
              if v in {'claim:CLAIM-EMPLOYMENT-LIVE-VACANCY-034:ACTIVE','lease:coordination/execution-lease:TOKEN34:ACTIVE_CAS'}:
                  continue
              refs.append(v)
          refs += [
            'main:'+main,
            'claim:CLAIM-EMPLOYMENT-LIVE-VACANCY-034:RELEASED',
            'lease:coordination/execution-lease:TOKEN34:RELEASED_CAS',
            'lease-release-commit:'+evidence['external_lease_release']['commit'],
            'lease-release-blob:'+evidence['external_lease_release']['blob'],
            'qualification:repo-guard-35603945572:PASS',
            'employment-frontier:LIVE_OPPORTUNITY_FRONTIER_2026-09-21',
            'pr:475:TOKEN34_TERMINAL_NO_SEND'
          ]
          d['source_refs']=list(dict.fromkeys(refs))
          for key in ('relevant_paths','state_refs','survival_paths'):
              vals=d.get(key,[])
              if not isinstance(vals,list): vals=[]
              vals=[complete_hb if v==active_hb else v for v in vals]
              for v in [complete_hb,iteration,release_event,report,frontier,'STATE.md']:
                  if v not in vals and (key!='survival_paths' or v in {complete_hb,frontier,'STATE.md'}):
                      vals.append(v)
              d[key]=list(dict.fromkeys(vals))
          g=d.setdefault('graph',{})
          for node in g.get('nodes',[]):
              if node.get('id')=='C:CLAIM-EMPLOYMENT-LIVE-VACANCY-034':
                  node['state']='RELEASED_TOKEN_34_KEEP'
              elif node.get('id')=='L:GLOBAL-EXECUTION-LEASE-034':
                  node['state']='RELEASED_CAS'
              elif node.get('id')=='W:WS-LIVE-VACANCY-PACKETS':
                  node['state']='COMPLETE_NO_SEND'
          p.write_text(json.dumps(d,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')

          p=Path('docs/state/NEXT.json')
          n=json.loads(p.read_text())
          n['generated_at']=evidence['recorded_at']
          n['active_claim']=None
          n['execution_mode']='EMPLOYMENT_ACQUISITION_NO_SEND_TERMINAL'
          n['successor_execution_allowed']=False
          n['exact_dependency']='Token34 is terminal on both Git and external lease surfaces. Four private application packets remain NO-SEND; submission/outbound requires a separate eligible authority path.'
          n['hard_blockers']=[
            'APPLICATION_SUBMISSION_NOT_AUTHORIZED',
            'OUTBOUND_CLOSED',
            'CRM_UNIVERSE_COMPLETE_FALSE_RECONCILE_REQUIRED_1403',
            'MANDARIN_AND_ALPINA_ENGLISH_SELF_VERIFICATION_REQUIRED',
            'LENKERHOF_HOUSEKEEPING_EXPERIENCE_GAP',
            'JUHUI_FIRST_PARTY_REVALIDATION_REQUIRED'
          ]
          n['next_safe_actions']=[
            'Verify terminal projections show zero active writers and fencing high-watermark34.',
            'Require final exact-head repo-guard and exact-main repo-guard after promotion.',
            'Preserve the live opportunity frontier and private NO-SEND packets.',
            'Do not send applications, email, DM, WhatsApp or portal submissions under token34.'
          ]
          n.setdefault('safety',{}).update({
            'authority_advanced':False,'h_id_allocations':0,'canonical_id_reservations':0,
            'crm_universe_complete':False,'outbound':'CLOSED','send_allowed':0,'irreversible_external_actions':0
          })
          p.write_text(json.dumps(n,ensure_ascii=False,sort_keys=True,indent=2)+'\n')

          p=Path('STATE.md')
          s=p.read_text()
          s=re.sub(
            r"## Current writer\n.*?(?=\n## Domain authority)",
            "## Current writer\n\nToken34 is terminal: claim RELEASED, external lease RELEASED, heartbeat COMPLETE. No active writer is authorized by this wave.\n",
            s, flags=re.S
          )
          s=s.replace('## NEXT — token34','## NEXT — after token34')
          terminal_note=(
            "\n## Token34 result\n\n"
            "- Four private vacancy-specific application packets are PACKET_COMPILED_NO_SEND.\n"
            "- Public-safe opportunity frontier is durable in docs/state/employment/LIVE_OPPORTUNITY_FRONTIER_2026-09-21.json.\n"
            "- No application/email/portal/DM was submitted. OUTBOUND remains CLOSED and send_allowed remains 0.\n"
            "- Any future send requires a separate eligible claim and governing authorization; token34 cannot be revived.\n"
          )
          if '## Token34 result' not in s:
              s=s.rstrip()+terminal_note
          p.write_text(s.rstrip()+'\n')
          PY
      - name: Materialize terminal Runtime Graph
        run: |
          AS_OF=$(python - <<'PY'
          import json
          from pathlib import Path
          vals=[]
          for p in Path('docs/state/agent-runtime/heartbeats').glob('*.json'):
              d=json.loads(p.read_text()); v=d.get('observed_at')
              if isinstance(v,str) and v: vals.append(v)
          print(max(vals))
          PY
          )
          python scripts/rebuild_agent_runtime_graph.py --as-of "$AS_OF" --output docs/state/agent-runtime/runtime-graph.json
          python scripts/rebuild_agent_runtime_graph.py --check
      - name: Materialize terminal V2 coordination and Context Survival
        run: |
          rm -rf /tmp/v2-token34-terminal /tmp/v2-token34-terminal-check
          python scripts/rebuild_v2_coordination.py --config docs/refactor-v2/coordination_current_config.json --output-dir /tmp/v2-token34-terminal
          cp /tmp/v2-token34-terminal/active-claims.json docs/state/v2/active-claims.json
          cp /tmp/v2-token34-terminal/project-state.json docs/state/v2/project-state.json
          cp /tmp/v2-token34-terminal/context-pack.json docs/state/v2/context-pack.json
          cp /tmp/v2-token34-terminal/graph-snapshot.json docs/state/v2/graph-snapshot.json
          cp /tmp/v2-token34-terminal/CONTEXT_SURVIVAL.json docs/continuity/CONTEXT_SURVIVAL.json
          python scripts/rebuild_v2_coordination.py --config docs/refactor-v2/coordination_current_config.json --output-dir /tmp/v2-token34-terminal-check --check
      - name: Assert zero-writer terminal employment state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('docs/state/v2/active-claims.json').read_text())
          r=json.loads(Path('docs/state/agent-runtime/runtime-graph.json').read_text())
          n=json.loads(Path('docs/state/NEXT.json').read_text())
          f=json.loads(Path('docs/state/employment/LIVE_OPPORTUNITY_FRONTIER_2026-09-21.json').read_text())
          assert a['claims']==[] and a['collisions']==[]
          assert a['fencing_high_watermark']==34
          assert r['active_sessions']==[]
          assert n['active_claim'] is None and n['successor_execution_allowed'] is False
          assert n['safety']['outbound']=='CLOSED' and n['safety']['send_allowed']==0
          assert f['outbound']=='CLOSED' and f['send_allowed']==0
          assert sum(1 for x in f['opportunities'] if x['packet_state'].startswith('PACKET_COMPILED_NO_SEND'))>=4
          PY
      - name: Commit terminal projections and remove one-shot workflow
        run: |
          git add STATE.md docs/refactor-v2/coordination_current_config.json docs/state/NEXT.json docs/state/agent-runtime/runtime-graph.json docs/state/v2/active-claims.json docs/state/v2/project-state.json docs/state/v2/context-pack.json docs/state/v2/graph-snapshot.json docs/continuity/CONTEXT_SURVIVAL.json
          git rm .github/workflows/employment-token34-materialize.yml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'employment: seal token34 zero-writer no-send state'
          git push origin HEAD:employment/live-vacancy-packets-token34-20260921

name: convergence-projections-materialize

on:
  push:
    branches: [convergence/main-singularity]
    paths:
      - '.github/workflows/convergence-runtime-graph-materialize.yml'
      - 'docs/refactor-v2/coordination_current_config.json'
      - 'docs/state/NEXT_CONVERGENCE_ONLY_2026-09-12.json'
      - 'docs/state/agent-runtime/heartbeats/HB-AGENT-GPT56SOL-CONVERGENCE-020-202408.json'
      - 'docs/state/v2/claims/CLAIM-CONVERGENCE-LEASE-020.json'
      - 'STATE.md'

permissions:
  contents: write

concurrency:
  group: convergence-projections-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Require live token20 lease parity before mutation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/execution_lease_live_guard.py
      - name: Stabilize dual-plane coordination inputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('docs/refactor-v2/coordination_current_config.json')
          data=json.loads(path.read_text())
          old_pointer='docs/state/v2/NEXT_CONVERGENCE_ONLY_2026-09-12.json'
          new_pointer='docs/state/NEXT_CONVERGENCE_ONLY_2026-09-12.json'
          old_hb='docs/state/agent-runtime/heartbeats/HB-AGENT-GPT56SOL-CONVERGENCE-020-200442.json'
          new_hb='docs/state/agent-runtime/heartbeats/HB-AGENT-GPT56SOL-CONVERGENCE-020-202408.json'
          mutable_receipt='docs/reports/convergence/CONVERGENCE_CHECKPOINT_2026-09-12.json'
          data['generated_at']='2026-09-12T20:24:08Z'
          data['latest_domain_next']=new_pointer
          for key in ('state_refs','relevant_paths','survival_paths'):
              values=data.get(key,[])
              if isinstance(values,list):
                  values=[new_pointer if v==old_pointer else new_hb if v==old_hb else v for v in values]
                  values=[v for v in values if v != mutable_receipt]
                  data[key]=list(dict.fromkeys(values))
          verified=data.setdefault('verified_work',[])
          finding='Dual-plane NEXT compatibility preserves root CRM domain monotonicity while Context Survival executes from a separate CONVERGENCE_ONLY control pointer with B12 execution disabled.'
          if finding not in verified:
              verified.append(finding)
          live=data.setdefault('liveness_findings',[])
          hb_finding='Fresh token20 heartbeat HB-AGENT-GPT56SOL-CONVERGENCE-020-202408 observed at 2026-09-12T20:24:08Z is the current liveness boundary.'
          if hb_finding not in live:
              live.append(hb_finding)
          path.write_text(json.dumps(data,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')
          PY
      - name: Preserve root domain NEXT while projecting convergence execution gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('docs/state/NEXT.json')
          data=json.loads(path.read_text())
          data['generated_at']='2026-09-12T20:24:08Z'
          data['parent_git_sha']='3c902a791be0e8df1db564034e211ea90c41f1b3'
          data['parent_sha_semantics']='Resume only if current main is this SHA or an ancestry-safe descendant with no relevant-scope drift and the E4 authority tuple is unchanged.'
          data['active_claim']={
            'claim_id':'CLAIM-CONVERGENCE-LEASE-020',
            'fencing_token':20,
            'authority_ceiling':'CONVERGENCE_ORCHESTRATION_AND_LEASE_REPAIR_ONLY_NO_DOMAIN_OR_OUTBOUND_AUTHORITY',
            'branch':'convergence/main-singularity',
            'session_id':'SES-20260912T190500Z-CONVERGENCE-020'
          }
          data['execution_mode']='RECOVERY_RECONCILE'
          data['selected_route']='CURRENT_UNRESOLVED_1403_ENTITY_RESOLUTION'
          data['next_route']='CURRENT_UNRESOLVED_1403_ENTITY_RESOLUTION'
          data['convergence_route']='CONVERGENCE_ONLY'
          data['successor_execution_allowed']=False
          data['exact_dependency']='CRM domain remains CURRENT_UNRESOLVED_1403_ENTITY_RESOLUTION, but GOAL-DRAIN blocks B12 execution while the independent control-plane route is CONVERGENCE_ONLY.'
          data['hard_blockers']=[
            'PR_463_EXACT_HEAD_GAUNTLET_NOT_YET_GREEN',
            'GLOBAL_EXECUTION_LEASE_NOT_CANONICAL_UNTIL_EXPLICITLY_AUTHORIZED_MERGE',
            'RECONCILE_REQUIRED_1403_NOT_ZERO',
            'GOAL_DRAIN_BLOCKS_B12_AUTOMATIC_EXECUTION',
            'OUTBOUND_CLOSED'
          ]
          data['next_safe_actions']=[
            'Read docs/state/NEXT_CONVERGENCE_ONLY_2026-09-12.json for execution eligibility.',
            'Keep CURRENT_UNRESOLVED_1403_ENTITY_RESOLUTION as the domain monotonicity route only.',
            'Run exact-head repo/death/context/unit/canary gauntlet.',
            'Persist KEEP/BLOCKED receipt and terminal heartbeat only after objective evidence.',
            'Do not merge PR #463 without explicit owner instruction.'
          ]
          review=data.setdefault('review_frontier',{})
          review['cumulative_new_canonical_preauth']=214
          review['current_lt350_reviewed_cumulative']=110
          review['zero_same_city_lane_remaining']=375
          review['historical_lt350_tail_remaining']=1179
          required=data.get('required_inputs')
          if isinstance(required,list) and required:
              required[0]='GitHub current main 3c902a791be0e8df1db564034e211ea90c41f1b3 or ancestry-safe descendant'
          data['required_inputs']=required
          safety=data.setdefault('safety',{})
          safety.update({'authority_advanced':False,'h_id_allocations':0,'canonical_id_reservations':0,'crm_universe_complete':False,'outbound':'CLOSED','send_allowed':0,'irreversible_external_actions':0})
          path.write_text(json.dumps(data,ensure_ascii=False,sort_keys=True,indent=2)+'\n')

          project_path=Path('docs/state/v2/project-state.json')
          project=json.loads(project_path.read_text())
          live=project.setdefault('live_frontier',{})
          live['total_new_canonical_preauth']=214
          live['current_lt350_reviewed_cumulative']=110
          live['zero_same_city_lane_remaining']=375
          live['historical_lt350_tail_remaining']=1179
          project_path.write_text(json.dumps(project,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')
          PY
      - name: Materialize deterministic Runtime Graph
        run: |
          set -euo pipefail
          AS_OF=$(python - <<'PY'
          import json
          from pathlib import Path
          values=[]
          for path in Path('docs/state/agent-runtime/heartbeats').glob('*.json'):
              data=json.loads(path.read_text())
              value=data.get('observed_at')
              if isinstance(value,str) and value:
                  values.append(value)
          print(max(values) if values else '1970-01-01T00:00:00Z')
          PY
          )
          python scripts/rebuild_agent_runtime_graph.py --as-of "$AS_OF" --output docs/state/agent-runtime/runtime-graph.json
          python scripts/rebuild_agent_runtime_graph.py --check
      - name: Materialize deterministic V2 coordination and Context Survival
        run: |
          set -euo pipefail
          rm -rf /tmp/v2-convergence
          python scripts/rebuild_v2_coordination.py \
            --config docs/refactor-v2/coordination_current_config.json \
            --output-dir /tmp/v2-convergence
          cp /tmp/v2-convergence/active-claims.json docs/state/v2/active-claims.json
          cp /tmp/v2-convergence/project-state.json docs/state/v2/project-state.json
          cp /tmp/v2-convergence/context-pack.json docs/state/v2/context-pack.json
          cp /tmp/v2-convergence/graph-snapshot.json docs/state/v2/graph-snapshot.json
          cp /tmp/v2-convergence/CONTEXT_SURVIVAL.json docs/continuity/CONTEXT_SURVIVAL.json
          python scripts/rebuild_v2_coordination.py \
            --config docs/refactor-v2/coordination_current_config.json \
            --output-dir /tmp/v2-convergence-check \
            --check
      - name: Assert dual-plane post-B11 compatibility
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=json.loads(Path('docs/state/NEXT.json').read_text())
          control=json.loads(Path('docs/state/NEXT_CONVERGENCE_ONLY_2026-09-12.json').read_text())
          project=json.loads(Path('docs/state/v2/project-state.json').read_text())
          config=json.loads(Path('docs/refactor-v2/coordination_current_config.json').read_text())
          state=Path('STATE.md').read_text()
          assert root['next_route']=='CURRENT_UNRESOLVED_1403_ENTITY_RESOLUTION'
          assert root['selected_route']=='CURRENT_UNRESOLVED_1403_ENTITY_RESOLUTION'
          assert root['convergence_route']=='CONVERGENCE_ONLY'
          assert root['successor_execution_allowed'] is False
          assert control['route']=='CONVERGENCE_ONLY'
          assert control['backlog']['execution_allowed'] is False
          assert config['latest_domain_next']=='docs/state/NEXT_CONVERGENCE_ONLY_2026-09-12.json'
          assert config['latest_domain_next'] in config['survival_paths']
          assert root['review_frontier']['cumulative_new_canonical_preauth']==214
          assert root['review_frontier']['current_lt350_reviewed_cumulative']==110
          assert project['live_frontier']['total_new_canonical_preauth']==214
          assert project['active_claim_ids']==['CLAIM-CONVERGENCE-LEASE-020']
          assert re.search(r'lower49 typed SRR materialized\s+47 / 47',state)
          assert re.search(r'RAGR evidence-classified\s+34 / 34',state)
          PY
      - name: Commit exact generated projections
        run: |
          set -euo pipefail
          git add \
            docs/refactor-v2/coordination_current_config.json \
            docs/state/NEXT.json \
            docs/state/agent-runtime/runtime-graph.json \
            docs/state/v2/active-claims.json \
            docs/state/v2/project-state.json \
            docs/state/v2/context-pack.json \
            docs/state/v2/graph-snapshot.json \
            docs/continuity/CONTEXT_SURVIVAL.json
          if git diff --cached --quiet; then
            echo 'All convergence projections already canonical.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'coordination: preserve domain monotonicity under convergence gate'
          git push origin HEAD:convergence/main-singularity

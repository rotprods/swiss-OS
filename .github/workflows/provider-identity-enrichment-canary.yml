name: provider-identity-enrichment-canary

on:
  push:
    branches: [main]
    paths:
      - 'docs/state/PROVIDER_IDENTITY_WORK_*.json'
  workflow_dispatch:
    inputs:
      packet_path:
        description: 'Repository-relative provider identity work packet'
        required: true
        default: 'docs/state/PROVIDER_IDENTITY_WORK_0001_33206402141.json'

permissions:
  contents: read

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Select bounded packet
        id: packet
        shell: bash
        env:
          INPUT_PACKET: ${{ github.event.inputs.packet_path }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_PACKET:-}" ]]; then
            PACKET="$INPUT_PACKET"
            [[ "$PACKET" == docs/state/PROVIDER_IDENTITY_WORK_*.json ]]
            [[ "$PACKET" != *".."* ]]
          else
            PACKET="$(python -m swiss_os.provider_identity_packet_selection --git-diff "$PUSH_BEFORE" "$PUSH_AFTER")"
          fi
          [[ -f "$PACKET" ]]
          echo "path=$PACKET" >> "$GITHUB_OUTPUT"
      - name: Run read-only provider identity enrichment
        run: |
          set -euo pipefail
          python -m swiss_os.provider_identity_enrichment run '${{ steps.packet.outputs.path }}' --out provider-identity-enrichment.json
          python -m swiss_os.provider_identity_enrichment validate provider-identity-enrichment.json
      - name: Artifact hashes
        run: sha256sum provider-identity-enrichment.json > provider-identity-enrichment.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: provider-identity-enrichment-${{ github.run_id }}
          path: |
            provider-identity-enrichment.json
            provider-identity-enrichment.sha256
          if-no-files-found: error

name: convergence-token25-terminalize

on:
  push:
    branches:
      - convergence/terminalization-parity-token23-20260913
    paths:
      - .github/workflows/convergence-token23-bootstrap.yml
      - docs/state/v2/claims/CLAIM-CONVERGENCE-TERMINALIZATION-025.json
      - docs/state/v2/events/EVT-20260915T083603Z-CONVERGENCE-TOKEN25-WORK-COMPLETED.json
      - docs/state/agent-runtime/heartbeats/HB-AGENT-GPT56SOL-CONVERGENCE-025-COMPLETE.json
      - docs/state/agent-runtime/iterations/ITER-convergence-terminal-lineage-token25.json
      - docs/reports/convergence/TOKEN25_TERMINAL_LINEAGE_RELEASE_READBACK_2026-09-15.json

permissions:
  contents: write

concurrency:
  group: convergence-token25-terminalize
  cancel-in-progress: false

jobs:
  terminalize:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Require zero-claim plus released external lease parity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/execution_lease_live_guard.py --receipt /tmp/execution-lease-token25-terminal.json

      - name: Finalize token25 convergence semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          main='3c902a791be0e8df1db564034e211ea90c41f1b3'
          claim='CLAIM-CONVERGENCE-TERMINALIZATION-025'
          session='SES-20260915T082640Z-CONVERGENCE-025'
          complete_hb='docs/state/agent-runtime/heartbeats/HB-AGENT-GPT56SOL-CONVERGENCE-025-COMPLETE.json'
          init_hb='docs/state/agent-runtime/heartbeats/HB-AGENT-GPT56SOL-CONVERGENCE-025-INIT.json'
          iteration='docs/state/agent-runtime/iterations/ITER-convergence-terminal-lineage-token25.json'
          readback='docs/reports/convergence/TOKEN25_TERMINAL_LINEAGE_RELEASE_READBACK_2026-09-15.json'

          path=Path('docs/refactor-v2/coordination_current_config.json')
          data=json.loads(path.read_text())
          data['generated_at']='2026-09-15T08:36:03Z'
          data['state']='CONVERGENCE_TOKEN25_RELEASED_AWAITING_FINAL_ZERO_WRITER_GAUNTLET'
          data['branch']='convergence/terminalization-parity-token23-20260913'
          data['open_prs']=[464]
          for key in ('state_refs','relevant_paths','survival_paths'):
              values=data.get(key,[])
              if isinstance(values,list):
                  values=[complete_hb if v==init_hb else v for v in values]
                  for value in (complete_hb,iteration,readback,'scripts/material_mutation_lineage_guard.py','tests/test_material_mutation_lineage.py'):
                      if value not in values and (key!='survival_paths' or value in (complete_hb,readback,'scripts/material_mutation_lineage_guard.py')):
                          values.append(value)
                  data[key]=list(dict.fromkeys(values))
          refs=[]
          for value in data.get('source_refs',[]):
              if value in {
                  'claim:CLAIM-CONVERGENCE-TERMINALIZATION-025:ACTIVE',
                  'lease:coordination/execution-lease:TOKEN25:ACTIVE_CAS'
              }:
                  continue
              refs.append(value)
          for value in [
              'claim:CLAIM-CONVERGENCE-TERMINALIZATION-025:RELEASED',
              'lease:coordination/execution-lease:TOKEN25:RELEASED_CAS',
              'lease-release-commit:742472a28bd593f7ff45096e3f3f92bee2d4fd37',
              'lease-release-blob:651adb78753c2dd37f49459654d33e3e421e0424',
              'qualification:repo-guard-4464:PASS',
              'repair:TERMINAL_LINEAGE_BRANCH_PROVENANCE:PROVEN'
          ]:
              if value not in refs:
                  refs.append(value)
          data['source_refs']=refs
          data['liveness_findings']=[
              'Token24 completed two-surface terminalization and token25 was immediately admitted without TTL waiting.',
              'Token25 exact-tree repo-guard 4464 passed the branch-aware lineage repair plus every existing coordination/recovery/unit/canary gate.',
              'Claim25 RELEASED at 2026-09-15T08:34:06Z before external lease release; COMPLETE was intentionally withheld during the fail-closed gap.',
              'External lease25 was CAS-released at 2026-09-15T08:35:19Z and read back active_lease=null, last_lease token25 RELEASED, watermark25.',
              'Heartbeat25 COMPLETE is valid only after that external readback. Domain authority remains E4/690 and OUTBOUND CLOSED.'
          ]
          data['blockers']=[
              'One final exact-head zero-writer repository gauntlet must pass on terminal token25 projections.',
              'Explicit owner merge instruction is required before PR #464 promotion.',
              'The global execution-lease/CAS contract remains candidate-only until an explicitly authorized merge.',
              'CRM_UNIVERSE_COMPLETE remains false because RECONCILE_REQUIRED=1403; B12 remains blocked.',
              'OUTBOUND remains CLOSED and send_allowed=0.'
          ]
          data['next_safe_actions']=[
              'Require zero active claims/sessions with fencing high-watermark25 and external active_lease=null.',
              'Run final exact-head terminal-state repository gauntlet.',
              'Re-read live main for relevant-scope drift after final CI.',
              'Await explicit owner merge instruction for PR #464; do not start B12 or outbound.'
          ]
          verified=data.setdefault('verified_work',[])
          for fact in [
              'Token25 exact-tree active-state repo-guard 4464 / workflow 34947621820 passed every declared gate.',
              'Branch-aware terminal lineage regression selects the unique current-branch owner only after explicit succession collapse while preserving same-branch/no-match ambiguity.',
              'External token25 release commit 742472a28bd593f7ff45096e3f3f92bee2d4fd37 read back active_lease=null, last_lease token25 RELEASED and watermark25.'
          ]:
              if fact not in verified:
                  verified.append(fact)
          data['unverified_work']=[
              'Terminal Runtime Graph/V2/Context Survival projections must be resealed from claim25 RELEASED + heartbeat COMPLETE.',
              'Final PR-wide material lineage guard must select claim25 over inherited claim21 provenance.',
              'One final exact-head zero-writer gauntlet must pass.',
              'Fresh-main relevant-scope drift must be checked after final CI.',
              'Promotion/merge remains an explicit owner action.'
          ]
          graph=data.setdefault('graph',{})
          for node in graph.get('nodes',[]):
              if node.get('id')=='C:CLAIM-CONVERGENCE-TERMINALIZATION-025':
                  node['state']='RELEASED_TOKEN_25_KEEP'
              elif node.get('id')=='L:GLOBAL-EXECUTION-LEASE-025':
                  node['state']='RELEASED_CAS'
              elif node.get('id')=='PR:464':
                  node['state']='TOKEN25_TERMINAL_RESEALED_AWAITING_FINAL_GAUNTLET'
              elif node.get('id')=='ISSUE:54':
                  node['state']='TERMINALIZATION_AND_LINEAGE_PARITY_PROVEN_IN_CANDIDATE'
          path.write_text(json.dumps(data,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')

          path=Path('docs/state/NEXT.json')
          root=json.loads(path.read_text())
          root['generated_at']='2026-09-15T08:36:03Z'
          root['active_claim']=None
          root['execution_mode']='RECOVERY_RECONCILE'
          root['selected_route']='CURRENT_UNRESOLVED_1403_ENTITY_RESOLUTION'
          root['next_route']='CURRENT_UNRESOLVED_1403_ENTITY_RESOLUTION'
          root['convergence_route']='CONVERGENCE_TOKEN25_RELEASED_AWAITING_FINAL_ZERO_WRITER_GAUNTLET'
          root['successor_execution_allowed']=False
          root['exact_dependency']='Claim25 and its external CAS lease are both terminal RELEASED; no successor writer is authorized while the convergence candidate awaits final zero-writer qualification and explicit owner merge instruction.'
          root['hard_blockers']=[
              'FINAL_ZERO_WRITER_GAUNTLET_REQUIRED_FOR_PR_464',
              'EXPLICIT_OWNER_MERGE_INSTRUCTION_REQUIRED_FOR_PR_464',
              'GLOBAL_EXECUTION_LEASE_NOT_CANONICAL_UNTIL_EXPLICITLY_AUTHORIZED_MERGE',
              'RECONCILE_REQUIRED_1403_NOT_ZERO',
              'GOAL_DRAIN_BLOCKS_B12_AUTOMATIC_EXECUTION',
              'OUTBOUND_CLOSED'
          ]
          root['next_safe_actions']=[
              'Verify terminal projections show zero active writers and fencing high-watermark25.',
              'Run final exact-head terminal-state gauntlet.',
              'Re-read live main for relevant-scope drift.',
              'Await explicit owner merge instruction; do not start B12 or outbound.'
          ]
          root.setdefault('safety',{}).update({'authority_advanced':False,'h_id_allocations':0,'canonical_id_reservations':0,'crm_universe_complete':False,'outbound':'CLOSED','send_allowed':0,'irreversible_external_actions':0})
          path.write_text(json.dumps(root,ensure_ascii=False,sort_keys=True,indent=2)+'\n')

          for pointer in [Path('docs/state/NEXT_CONVERGENCE_ONLY_2026-09-12.json'),Path('docs/state/v2/NEXT_CONVERGENCE_ONLY_2026-09-12.json')]:
              p=json.loads(pointer.read_text())
              p['claim_id']=claim
              p['claim_state']='RELEASED'
              p['fencing_token']=25
              p['session_id']=session
              p['status']='TOKEN25_TERMINAL_RESEALED_AWAITING_FINAL_GAUNTLET'
              p['blockers']=[
                  'Final exact-head zero-writer gauntlet is required before PR #464 can be considered technically qualified.',
                  'Explicit owner merge instruction is required before PR #464 promotion.',
                  'CRM_UNIVERSE_COMPLETE remains FALSE because RECONCILE_REQUIRED=1403.',
                  'No successor writer or outbound action is authorized.'
              ]
              p['next_safe_actions']=[
                  'Run final exact-head zero-writer gauntlet.',
                  'Re-read live main for relevant-scope drift.',
                  'Await explicit owner merge instruction; do not start B12.'
              ]
              p['qualification']={'decision':'KEEP','active_state_repo_guard_run_number':4464,'active_state_workflow_run_id':34947621820,'active_state_result':'PASS','external_lease_release':'PASS','lineage_guard_repair':'PASS','final_terminal_gauntlet':'PENDING'}
              pointer.write_text(json.dumps(p,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')

          state=Path('STATE.md').read_text()
          first_end=state.index('\n\n## Authority')
          state='# STATE — LIVE HANDOFF POINTER\n\nLatest reconciled GitHub frontier: **main `'+main+'`**. B11 is merged and SWISS-OS remains in **`CONVERGENCE_ONLY`**. Draft PR **#464** is the single convergence candidate. Token25 repaired inherited terminal-lineage ambiguity, passed full active-state qualification, and is now **terminal KEEP / RELEASED** on both Git claim and external CAS lease surfaces. No successor writer is authorized.\n'+state[first_end:]
          start=state.index('## Global writer serialization')
          end=state.index('## Convergence progress')
          replacement='''## Global writer serialization — terminalization + lineage parity proven\n\nThe duplicate-token18 collision is protected by the candidate GitHub blob-SHA CAS lease. The later orphan-lease defect was exercised through token24 two-surface terminalization. Token25 then repaired the final PR-wide lineage ambiguity without weakening same-branch fail-closed behavior.\n\nToken25 lifecycle:\n\n```text\nclaim          CLAIM-CONVERGENCE-TERMINALIZATION-025\nsession        SES-20260915T082640Z-CONVERGENCE-025\nfencing token  25\nstate          RELEASED\niteration      ITER-convergence-terminal-lineage-token25 = KEEP\nactive qualify repo-guard 4464 / workflow 34947621820 = PASS\nlease release  commit 742472a28bd593f7ff45096e3f3f92bee2d4fd37\nlease readback active_lease=null / last_lease=token25 RELEASED / watermark=25\n```\n\nCOMPLETE was withheld until external release readback. The material lineage guard now ignores inherited terminal provenance from another branch only when exactly one terminal owner belongs to the current PR branch; same-branch and no-match ambiguity remain fail-closed.\n\n'''
          state=state[:start]+replacement+state[end:]
          start=state.index('## NEXT')
          state=state[:start]+'''## NEXT\n\nCurrent control state is **terminal convergence candidate awaiting final zero-writer gauntlet and explicit owner merge instruction**.\n\n```text\nreseal Runtime Graph + V2/Context Survival to zero active writers / watermark25\n→ final exact-head terminal-state gauntlet\n→ re-read live main for drift\n→ await explicit owner merge instruction for PR #464\n```\n\nDo not open B12, Semantic V4 or another feature wave. Do not merge PR #464 without explicit owner instruction. Keep `OUTBOUND=CLOSED` / `send_allowed=0`.\n\n**VERIFY LIVE TRUTH BEFORE EXECUTION.**\n'''
          Path('STATE.md').write_text(state)
          PY

      - name: Materialize terminal Runtime Graph
        run: |
          set -euo pipefail
          AS_OF=$(python - <<'PY'
          import json
          from pathlib import Path
          values=[]
          for path in Path('docs/state/agent-runtime/heartbeats').glob('*.json'):
              data=json.loads(path.read_text())
              value=data.get('observed_at')
              if isinstance(value,str) and value:
                  values.append(value)
          print(max(values) if values else '1970-01-01T00:00:00Z')
          PY
          )
          python scripts/rebuild_agent_runtime_graph.py --as-of "$AS_OF" --output docs/state/agent-runtime/runtime-graph.json
          python scripts/rebuild_agent_runtime_graph.py --check

      - name: Materialize terminal V2 coordination and Context Survival
        run: |
          set -euo pipefail
          rm -rf /tmp/v2-token25-terminal /tmp/v2-token25-terminal-check
          python scripts/rebuild_v2_coordination.py --config docs/refactor-v2/coordination_current_config.json --output-dir /tmp/v2-token25-terminal
          cp /tmp/v2-token25-terminal/active-claims.json docs/state/v2/active-claims.json
          cp /tmp/v2-token25-terminal/project-state.json docs/state/v2/project-state.json
          cp /tmp/v2-token25-terminal/context-pack.json docs/state/v2/context-pack.json
          cp /tmp/v2-token25-terminal/graph-snapshot.json docs/state/v2/graph-snapshot.json
          cp /tmp/v2-token25-terminal/CONTEXT_SURVIVAL.json docs/continuity/CONTEXT_SURVIVAL.json
          python scripts/rebuild_v2_coordination.py --config docs/refactor-v2/coordination_current_config.json --output-dir /tmp/v2-token25-terminal-check --check

      - name: Assert zero-writer terminal state
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=json.loads(Path('docs/state/NEXT.json').read_text())
          control=json.loads(Path('docs/state/NEXT_CONVERGENCE_ONLY_2026-09-12.json').read_text())
          active=json.loads(Path('docs/state/v2/active-claims.json').read_text())
          project=json.loads(Path('docs/state/v2/project-state.json').read_text())
          runtime=json.loads(Path('docs/state/agent-runtime/runtime-graph.json').read_text())
          state=Path('STATE.md').read_text()
          assert active['claims']==[]
          assert active['collisions']==[]
          assert active['fencing_high_watermark']==25
          assert project['active_claim_ids']==[]
          assert runtime['active_sessions']==[]
          assert root['active_claim'] is None
          assert root['next_route']=='CURRENT_UNRESOLVED_1403_ENTITY_RESOLUTION'
          assert root['successor_execution_allowed'] is False
          assert control['claim_id']=='CLAIM-CONVERGENCE-TERMINALIZATION-025'
          assert control['claim_state']=='RELEASED'
          assert control['fencing_token']==25
          assert control['backlog']['execution_allowed'] is False
          assert re.search(r'ECV verified frontier\s+1438 / 1438',state)
          assert re.search(r'lower49 typed SRR materialized\s+47 / 47',state)
          assert re.search(r'RAGR evidence-classified\s+34 / 34',state)
          PY

      - name: Prove immediate token26 successor admission without mutation
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from swiss_os.execution_lease import LeaseAdmissionKind, LeaseRequest, evaluate_lease
          request=LeaseRequest(
              project_id='SWITZERLAND_JOB_OS',
              owner_agent_id='AGENT-ADMISSION-PROBE-026',
              run_id='RUN-ADMISSION-PROBE-026',
              session_id='SES-ADMISSION-PROBE-026',
              wave_id='WAVE-ADMISSION-PROBE-026',
              parent_main_sha='3c902a791be0e8df1db564034e211ea90c41f1b3',
              authority_epoch='HS_ENTITY_EPOCH_2026-08-25_E4',
              fencing_token=26,
          )
          result=evaluate_lease(None,request,datetime.now(timezone.utc),canonical_parent_sha=request.parent_main_sha,canonical_authority_epoch=request.authority_epoch,fencing_high_watermark=25)
          assert result.kind is LeaseAdmissionKind.ACQUIRE_ALLOWED
          assert result.writer_allowed is True
          print('token26 admission: ACQUIRE_ALLOWED (no lease committed)')
          PY

      - name: Run bounded lease and lineage regression suite
        run: |
          python -m unittest \
            tests.test_execution_lease \
            tests.test_github_execution_lease \
            tests.test_execution_lease_live_guard \
            tests.test_material_mutation_lineage \
            -v

      - name: Re-run zero-claim live lease guard after rebuild
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/execution_lease_live_guard.py --receipt /tmp/execution-lease-token25-zero-writer.json

      - name: Validate terminal material lineage scope
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          CHANGED=$({
            git diff --name-only refs/remotes/origin/main...HEAD
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u)
          export GRAPH_V2_CHANGED_PATHS="$CHANGED"
          python scripts/material_mutation_lineage_guard.py

      - name: Commit exact terminal projections
        run: |
          set -euo pipefail
          git add \
            STATE.md \
            docs/refactor-v2/coordination_current_config.json \
            docs/state/NEXT.json \
            docs/state/NEXT_CONVERGENCE_ONLY_2026-09-12.json \
            docs/state/v2/NEXT_CONVERGENCE_ONLY_2026-09-12.json \
            docs/state/agent-runtime/runtime-graph.json \
            docs/state/v2/active-claims.json \
            docs/state/v2/project-state.json \
            docs/state/v2/context-pack.json \
            docs/state/v2/graph-snapshot.json \
            docs/continuity/CONTEXT_SURVIVAL.json
          if git diff --cached --quiet; then
            echo 'Token25 terminal projections already canonical.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'coordination: reseal token25 zero-writer terminal state'
          git push origin HEAD:convergence/terminalization-parity-token23-20260913

name: live-mdc-capture

on:
  workflow_dispatch:
  push:
    branches:
      - ops/live-mdc-capture-20260828
    paths:
      - .github/workflows/live-mdc-capture.yml
      - src/swiss_os/adaptive_directory_capture.py

permissions:
  contents: read

concurrency:
  group: live-mdc-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Capture coherent HotellerieSuisse DE member directory
        id: capture
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/hs-directory-de"
          python -m swiss_os.adaptive_directory_capture capture \
            --root-url https://www.hotelleriesuisse.ch/de/verband-und-geschaeftsstelle/mitglieder/mitgliederverzeichnis \
            --locale de \
            --out-dir "$RUNNER_TEMP/hs-directory-de" \
            --delay 6.0 \
            --attempts 6 \
            --base-backoff 15 \
            --max-backoff 120 \
            --expected-page-size 12 \
            2>&1 | tee "$RUNNER_TEMP/hs-directory-de/CAPTURE_RUN.log"

      - name: Assert pre-authority hard locks when summary exists
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("${{ runner.temp }}") / "hs-directory-de"
          candidates = [root / "CAPTURE_SUMMARY.json", root / "MEMBER_DIRECTORY_MANIFEST.json"]
          for path in candidates:
              if not path.exists():
                  continue
              payload = json.loads(path.read_text(encoding="utf-8"))
              assert payload.get("authority_advanced", False) is False
              h_ids = payload.get("h_id_allocations", 0)
              assert isinstance(h_ids, int) and not isinstance(h_ids, bool) and h_ids == 0
              outbound = payload.get("outbound", "CLOSED")
              assert outbound == "CLOSED"
              send_allowed = payload.get("send_allowed", 0)
              assert isinstance(send_allowed, int) and not isinstance(send_allowed, bool) and send_allowed == 0
          PY

      - name: Upload capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hs-directory-de-capture
          path: ${{ runner.temp }}/hs-directory-de/
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce coherent-capture result
        if: steps.capture.outcome != 'success'
        shell: bash
        run: |
          echo "MDC capture did not reach a complete coherent manifest; evidence was uploaded for typed fallback/recovery."
          exit 1

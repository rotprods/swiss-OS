name: convergence-token28-projections-once

on:
  push:
    branches: [convergence/postmerge-recovery-token28-20260915]
    paths:
      - '.github/workflows/convergence-runtime-graph-materialize.yml'

permissions:
  contents: write

concurrency:
  group: convergence-token28-projections-once
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prove token28 live ownership and exact branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'convergence/postmerge-recovery-token28-20260915'
          python scripts/execution_lease_live_guard.py
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('docs/state/v2/claims/CLAIM-CONVERGENCE-POSTMERGE-028.json').read_text())
          h=json.loads(Path('docs/state/agent-runtime/heartbeats/HB-AGENT-GPT56SOL-CONVERGENCE-028-INIT.json').read_text())
          assert c['state']=='ACTIVE' and c['fencing_token']==28
          assert h['state']=='ACTIVE' and h['claim_id']==c['claim_id']
          assert c['base_sha']=='38d52d60f109f373741ce95021a60b03ea69dffc'
          PY
      - name: Materialize deterministic Runtime Graph
        run: |
          set -euo pipefail
          AS_OF=$(python - <<'PY'
          import json
          from pathlib import Path
          values=[]
          for path in Path('docs/state/agent-runtime/heartbeats').glob('*.json'):
              data=json.loads(path.read_text())
              value=data.get('observed_at')
              if isinstance(value,str) and value:
                  values.append(value)
          print(max(values) if values else '1970-01-01T00:00:00Z')
          PY
          )
          python scripts/rebuild_agent_runtime_graph.py --as-of "$AS_OF" --output docs/state/agent-runtime/runtime-graph.json
          python scripts/rebuild_agent_runtime_graph.py --check
      - name: Reconcile deterministic coordination config to token28
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path=Path('docs/refactor-v2/coordination_current_config.json')
          data=json.loads(path.read_text())
          now='2026-09-15T14:43:37Z'
          branch='convergence/postmerge-recovery-token28-20260915'
          claim='CLAIM-CONVERGENCE-POSTMERGE-028'
          hb='docs/state/agent-runtime/heartbeats/HB-AGENT-GPT56SOL-CONVERGENCE-028-INIT.json'
          claim_path=f'docs/state/v2/claims/{claim}.json'
          event_path='docs/state/v2/events/EVT-20260915T144337Z-CONVERGENCE-TOKEN28-ACQUIRED.json'
          main='38d52d60f109f373741ce95021a60b03ea69dffc'

          data['generated_at']=now
          data['base_main_sha']=main
          data['branch']=branch
          data['state']='CONVERGENCE_TOKEN28_ACTIVE_POSTMERGE_RECOVERY'
          data['open_prs']=[466]
          data['blockers']=[
            'PR #466 must pass the full exact-head repository gauntlet before token28 terminalization.',
            'Token28 COMPLETE is forbidden until claim terminalization and external lease release/readback both succeed.',
            'Post-merge main must pass repo-guard before issue #54 can close.',
            'GitHub main protection/rulesets remain an external platform blocker tracked by #441.',
            'CRM_UNIVERSE_COMPLETE remains false at RECONCILE_REQUIRED=1403; B12 and OUTBOUND remain blocked.'
          ]
          data['next_safe_actions']=[
            'Materialize token28 active Runtime Graph/V2/Context Survival projections deterministically.',
            'Run the full exact-head PR #466 gauntlet and repair only evidenced blockers.',
            'Persist token28 KEEP receipt and terminal claim state while withholding COMPLETE.',
            'CAS-release lease28 and require active_lease=null readback before COMPLETE.',
            'Run final zero-writer exact-head gauntlet, merge only expected head, then require post-merge main green.'
          ]
          data['liveness_findings']=[
            'Token26 expired without a durable Git claim and is recovery provenance only.',
            'Token27 was acquired then released before material work after a non-material main drift invalidated its parent binding.',
            'Token28 is the sole active material writer, bound to current main 38d52d60 and E4.',
            'PR #466 first CI proved material lineage, stale fencing, heartbeat liveness and live lease parent freshness before stopping on stale derived projections.',
            'Operational authority remains E4/690, H-0691 unallocated, terminal mappings 658, RECONCILE_REQUIRED=1403 and OUTBOUND CLOSED.'
          ]
          data['resume_contract']=[
            f'verify live main remains {main} or stop and recover with a new session/token',
            'read coordination/execution-lease current.json and require token28/session028/parent-main/E4 parity plus live TTL',
            f'replay claims/events and require {claim} as the sole active claim with fencing token28',
            'verify E4/690, H-0691 unallocated, terminal mappings658 and RECONCILE_REQUIRED1403',
            'keep B12 backlog-only and OUTBOUND=CLOSED/send_allowed=0',
            'require exact Runtime Graph/V2/Context Survival equality before qualification',
            'terminalization is incomplete until claim28 terminal state AND external token28 release/readback both pass'
          ]

          # Remove only stale file references to intentionally deleted one-shot executables.
          for key in ('relevant_paths','state_refs','survival_paths'):
              values=data.get(key,[])
              if isinstance(values,list):
                  data[key]=[v for v in values if not isinstance(v,str) or not v.startswith(('.github/','docs/','scripts/','src/','tests/')) or Path(v).exists()]

          for rel in [
              claim_path,event_path,hb,
              'scripts/material_mutation_lineage_guard.py','tests/test_material_mutation_lineage.py',
              'scripts/execution_lease_live_guard.py','tests/test_execution_lease_live_guard.py',
              'docs/operations/EXECUTION_LEASE_PROTOCOL.md','docs/operations/EXECUTION_STOP_RULES_V1.md',
              'docs/state/agent-runtime/runtime-graph.json'
          ]:
              if Path(rel).exists() and rel not in data.setdefault('relevant_paths',[]):
                  data['relevant_paths'].append(rel)
          for rel in [claim_path,hb,'docs/state/agent-runtime/runtime-graph.json']:
              if rel not in data.setdefault('state_refs',[]): data['state_refs'].append(rel)
              if rel not in data.setdefault('survival_paths',[]): data['survival_paths'].append(rel)

          refs=data.setdefault('source_refs',[])
          for ref in [
              f'main:{main}',
              f'claim:{claim}:ACTIVE',
              'lease:coordination/execution-lease:TOKEN28:ACTIVE_CAS',
              'recovery:TOKEN26_EXPIRED_TO_TOKEN27_ABORTED_TO_TOKEN28',
              'repair:POSTMERGE_TERMINAL_LINEAGE_CAUSALITY',
              'repair:LIVE_LEASE_CANONICAL_PARENT_FRESHNESS',
              'pr:466:POSTMERGE_RECOVERY_CANDIDATE'
          ]:
              if ref not in refs: refs.append(ref)

          graph=data.setdefault('graph',{})
          nodes=graph.setdefault('nodes',[])
          by_id={n.get('id'):n for n in nodes if isinstance(n,dict)}
          desired={
              f'C:{claim}':('Claim','ACTIVE_TOKEN_28_POSTMERGE_RECOVERY'),
              'L:GLOBAL-EXECUTION-LEASE-028':('ExecutionLease','ACTIVE_CAS'),
              'PR:466':('PullRequest','ACTIVE_POSTMERGE_RECOVERY_CANDIDATE'),
              'ISSUE:54':('CoordinationBlocker','POSTMERGE_RECOVERY_IN_PROGRESS')
          }
          for nid,(typ,state) in desired.items():
              if nid in by_id:
                  by_id[nid]['type']=typ; by_id[nid]['state']=state
              else:
                  nodes.append({'id':nid,'type':typ,'state':state})
          edges=graph.setdefault('edges',[])
          wanted=[
              {'from':'C:CLAIM-CONVERGENCE-TERMINALIZATION-025','to':f'C:{claim}','type':'PREDECESSOR_OF'},
              {'from':'L:GLOBAL-EXECUTION-LEASE-028','to':f'C:{claim}','type':'SERIALIZES_WRITER'},
              {'from':f'C:{claim}','to':'ISSUE:54','type':'REPAIRS'},
              {'from':f'C:{claim}','to':'PR:466','type':'EXECUTES_ON'},
              {'from':'MODE:CONVERGENCE_ONLY','to':'PR:466','type':'CONSTRAINS'},
              {'from':'PR:466','to':'G:G-0001','type':'SERVES'},
              {'from':'A:E4-690','to':'PR:466','type':'AUTHORITY_CEILING'}
          ]
          for edge in wanted:
              if edge not in edges: edges.append(edge)
          graph['nodes']=sorted(nodes,key=lambda n:str(n.get('id','')))
          graph['edges']=sorted(edges,key=lambda e:(str(e.get('from','')),str(e.get('to','')),str(e.get('type',''))))

          path.write_text(json.dumps(data,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')
          PY
      - name: Materialize deterministic V2 and Context Survival
        run: |
          set -euo pipefail
          rm -rf /tmp/v2-token28 /tmp/v2-token28-check
          python scripts/rebuild_v2_coordination.py --config docs/refactor-v2/coordination_current_config.json --output-dir /tmp/v2-token28
          cp /tmp/v2-token28/active-claims.json docs/state/v2/active-claims.json
          cp /tmp/v2-token28/project-state.json docs/state/v2/project-state.json
          cp /tmp/v2-token28/context-pack.json docs/state/v2/context-pack.json
          cp /tmp/v2-token28/graph-snapshot.json docs/state/v2/graph-snapshot.json
          cp /tmp/v2-token28/CONTEXT_SURVIVAL.json docs/continuity/CONTEXT_SURVIVAL.json
          python scripts/rebuild_v2_coordination.py --config docs/refactor-v2/coordination_current_config.json --output-dir /tmp/v2-token28-check --check
      - name: Commit projections and self-delete one-shot
        run: |
          set -euo pipefail
          git rm .github/workflows/convergence-runtime-graph-materialize.yml
          git add docs/refactor-v2/coordination_current_config.json docs/state/agent-runtime/runtime-graph.json docs/state/v2/active-claims.json docs/state/v2/project-state.json docs/state/v2/context-pack.json docs/state/v2/graph-snapshot.json docs/continuity/CONTEXT_SURVIVAL.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'coordination: materialize token28 active projections'
          git push origin HEAD:convergence/postmerge-recovery-token28-20260915

name: employment-token35-active-projections

on:
  push:
    branches: [employment/source-registry-vacancy-v3-token35-20260921]
    paths:
      - '.github/workflows/employment-token35-materialize.yml'
      - 'STATE.md'
      - 'docs/state/v2/claims/CLAIM-EMPLOYMENT-SOURCE-VACANCY-035.json'
      - 'docs/state/v2/events/EVT-20260921T132000Z-EMPLOYMENT-TOKEN35-ACQUIRED.json'
      - 'docs/state/v2/events/EVT-20260921T132100Z-EMPLOYMENT-TOKEN35-WORK-STARTED.json'
      - 'docs/state/agent-runtime/heartbeats/HB-AGENT-GPT56SOL-SWARM-039-132100.json'

permissions:
  contents: write

concurrency:
  group: employment-token35-active-projections
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Require live token35 lease parity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/execution_lease_live_guard.py --receipt /tmp/execution-lease-token35-active.json
      - name: Refresh coordination config for A10 A30 wave
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          main='87eabd5955cd252fee8aa8a4cd5b016ee8f1a324'
          branch='employment/source-registry-vacancy-v3-token35-20260921'
          claim='docs/state/v2/claims/CLAIM-EMPLOYMENT-SOURCE-VACANCY-035.json'
          acquired='docs/state/v2/events/EVT-20260921T132000Z-EMPLOYMENT-TOKEN35-ACQUIRED.json'
          started='docs/state/v2/events/EVT-20260921T132100Z-EMPLOYMENT-TOKEN35-WORK-STARTED.json'
          heartbeat='docs/state/agent-runtime/heartbeats/HB-AGENT-GPT56SOL-SWARM-039-132100.json'

          p=Path('docs/refactor-v2/coordination_current_config.json')
          d=json.loads(p.read_text())
          d['base_main_sha']=main
          d['branch']=branch
          d['generated_at']='2026-09-21T13:25:00Z'
          d['state']='EMPLOYMENT_TOKEN35_ACTIVE_A10_A30_NO_SEND'
          d['open_prs']=[476]
          d['blockers']=[
            'A20 automated capture scale is excluded from token35.',
            'Application submission and outbound execution are excluded from token35.',
            'CRM_UNIVERSE_COMPLETE remains false at RECONCILE_REQUIRED=1403.',
            'GitHub main platform protection remains not enforced; issue #441 remains a separate platform gate.'
          ]
          d['next_safe_actions']=[
            'Materialize token35 active Runtime Graph/V2/Context Survival projections.',
            'Persist donor anti-join and current source-access registry.',
            'Implement additive Vacancy V3 identity/semantics without destructive V2 migration.',
            'Run exact-head repository gauntlet and repair only evidenced blockers.',
            'Terminalize token35 plus external lease release/readback and return to zero-writer.'
          ]
          d['liveness_findings']=[
            'Token34 live-vacancy frontier merged to canonical main 87eabd5955cd252fee8aa8a4cd5b016ee8f1a324 and exact-main repo-guard #4548 passed.',
            'Token35 acquired the global writer slot from zero-writer watermark34 and is parent-bound to canonical main.',
            'Token35 owns only A10 Source Registry, A30 Vacancy Semantics and donor anti-join; A20 scale, Candidate Truth, CRM/H-ID and outbound are excluded.',
            'Operational authority remains E4/690, H-0691 unallocated, terminal mappings 658, RECONCILE_REQUIRED=1403 and OUTBOUND CLOSED.'
          ]

          refs=[v for v in d.get('source_refs',[]) if isinstance(v,str)]
          refs += [
            'main:'+main,
            'claim:CLAIM-EMPLOYMENT-SOURCE-VACANCY-035:ACTIVE',
            'lease:coordination/execution-lease:TOKEN35:ACTIVE_CAS',
            'goal:G-0001:DIRECT_JOB_PROGRESS',
            'goal:G-0300:GENERIC_MARKET_UNIVERSE',
            'workstream:WS-EMPLOYMENT-SOURCE-REGISTRY-VACANCY-V3',
            'pr:476:A10_A30_SOURCE_VACANCY_V3'
          ]
          d['source_refs']=list(dict.fromkeys(refs))

          for key in ('relevant_paths','state_refs','survival_paths'):
              vals=d.get(key,[])
              if not isinstance(vals,list):
                  vals=[]
              for v in [claim,acquired,started,heartbeat,'STATE.md']:
                  if v not in vals:
                      vals.append(v)
              d[key]=vals

          g=d.setdefault('graph',{})
          nodes=g.setdefault('nodes',[])
          by={n.get('id'):n for n in nodes if isinstance(n,dict)}
          new_nodes=[
            {'id':'C:CLAIM-EMPLOYMENT-SOURCE-VACANCY-035','state':'ACTIVE_TOKEN_35_A10_A30_NO_SEND','type':'Claim'},
            {'id':'L:GLOBAL-EXECUTION-LEASE-035','state':'ACTIVE_CAS','type':'ExecutionLease'},
            {'id':'W:WS-EMPLOYMENT-SOURCE-REGISTRY-VACANCY-V3','state':'ACTIVE','type':'Workstream'},
            {'id':'O:OBJ-SWISS-REAL-JOB-ACQUISITION','state':'ACTIVE','type':'Objective'}
          ]
          for node in new_nodes:
              if node['id'] not in by:
                  nodes.append(node)

          edges=g.setdefault('edges',[])
          existing={(e.get('from'),e.get('to'),e.get('type')) for e in edges if isinstance(e,dict)}
          new_edges=[
            {'from':'L:GLOBAL-EXECUTION-LEASE-035','to':'C:CLAIM-EMPLOYMENT-SOURCE-VACANCY-035','type':'SERIALIZES_WRITER'},
            {'from':'C:CLAIM-EMPLOYMENT-SOURCE-VACANCY-035','to':'W:WS-EMPLOYMENT-SOURCE-REGISTRY-VACANCY-V3','type':'CLAIMS'},
            {'from':'W:WS-EMPLOYMENT-SOURCE-REGISTRY-VACANCY-V3','to':'O:OBJ-SWISS-REAL-JOB-ACQUISITION','type':'IMPLEMENTS'},
            {'from':'O:OBJ-SWISS-REAL-JOB-ACQUISITION','to':'G:G-0001','type':'CONTRIBUTES_TO'}
          ]
          for e in new_edges:
              k=(e['from'],e['to'],e['type'])
              if k not in existing:
                  edges.append(e)
                  existing.add(k)
          p.write_text(json.dumps(d,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')

          p=Path('docs/state/NEXT.json')
          n=json.loads(p.read_text())
          claim_obj=json.loads(Path(claim).read_text())
          n['generated_at']='2026-09-21T13:25:00Z'
          n['active_claim']=claim_obj
          n['execution_mode']='EMPLOYMENT_MARKET_MODEL_NO_SEND'
          n['successor_execution_allowed']=False
          n['exact_dependency']='Token35 owns only A10 Source Registry + A30 Vacancy Semantics/donor anti-join. A20 scale, CRM/H-ID, Candidate Truth, application submission and outbound remain excluded.'
          n['hard_blockers']=[
            'A20_AUTOMATED_CAPTURE_SCALE_EXCLUDED',
            'APPLICATION_SUBMISSION_EXCLUDED_FROM_TOKEN35',
            'OUTBOUND_EXECUTION_EXCLUDED_FROM_TOKEN35',
            'CRM_UNIVERSE_COMPLETE_FALSE_RECONCILE_REQUIRED_1403',
            'MAIN_PROTECTION_NOT_PLATFORM_ENFORCED'
          ]
          n['next_safe_actions']=[
            'Qualify SourceFamily/SourceSurface/DiscoveryProgram/GuidanceSurface semantics.',
            'Persist current source access policy and donor anti-join.',
            'Implement additive Vacancy V3 while preserving V2.',
            'Run exact-head qualification then terminalize token35 to zero-writer.',
            'Do not send any application, email, DM, WhatsApp or portal submission under token35.'
          ]
          n['parent_git_sha']=main
          req=n.get('required_inputs',[])
          req=[x for x in req if not (isinstance(x,str) and x.startswith('GitHub current main '))]
          req.insert(0,'GitHub current main '+main+' or ancestry-safe descendant with no relevant-scope drift')
          n['required_inputs']=req
          n.setdefault('safety',{}).update({
            'authority_advanced':False,
            'h_id_allocations':0,
            'canonical_id_reservations':0,
            'crm_universe_complete':False,
            'outbound':'CLOSED',
            'send_allowed':0,
            'irreversible_external_actions':0
          })
          p.write_text(json.dumps(n,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          PY
      - name: Materialize active Runtime Graph
        run: |
          AS_OF=$(python - <<'PY'
          import json
          from pathlib import Path
          vals=[]
          for p in Path('docs/state/agent-runtime/heartbeats').glob('*.json'):
              d=json.loads(p.read_text())
              v=d.get('observed_at')
              if isinstance(v,str) and v:
                  vals.append(v)
          print(max(vals))
          PY
          )
          python scripts/rebuild_agent_runtime_graph.py --as-of "$AS_OF" --output docs/state/agent-runtime/runtime-graph.json
          python scripts/rebuild_agent_runtime_graph.py --check
      - name: Materialize active V2 coordination and Context Survival
        run: |
          rm -rf /tmp/v2-token35-active /tmp/v2-token35-active-check
          python scripts/rebuild_v2_coordination.py --config docs/refactor-v2/coordination_current_config.json --output-dir /tmp/v2-token35-active
          cp /tmp/v2-token35-active/active-claims.json docs/state/v2/active-claims.json
          cp /tmp/v2-token35-active/project-state.json docs/state/v2/project-state.json
          cp /tmp/v2-token35-active/context-pack.json docs/state/v2/context-pack.json
          cp /tmp/v2-token35-active/graph-snapshot.json docs/state/v2/graph-snapshot.json
          cp /tmp/v2-token35-active/CONTEXT_SURVIVAL.json docs/continuity/CONTEXT_SURVIVAL.json
          python scripts/rebuild_v2_coordination.py --config docs/refactor-v2/coordination_current_config.json --output-dir /tmp/v2-token35-active-check --check
      - name: Assert active token35 and hard locks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('docs/state/v2/active-claims.json').read_text())
          r=json.loads(Path('docs/state/agent-runtime/runtime-graph.json').read_text())
          n=json.loads(Path('docs/state/NEXT.json').read_text())
          assert [c['claim_id'] for c in a['claims']]==['CLAIM-EMPLOYMENT-SOURCE-VACANCY-035']
          assert a['collisions']==[]
          assert a['fencing_high_watermark']>=35
          assert len(r['active_sessions'])==1
          assert r['active_sessions'][0]['session_id']=='SES-20260921T132000Z-SWARM-039'
          assert n['active_claim']['claim_id']=='CLAIM-EMPLOYMENT-SOURCE-VACANCY-035'
          assert n['execution_mode']=='EMPLOYMENT_MARKET_MODEL_NO_SEND'
          assert n['safety']['authority_advanced'] is False
          assert n['safety']['h_id_allocations']==0
          assert n['safety']['outbound']=='CLOSED'
          assert n['safety']['send_allowed']==0
          PY
      - name: Commit exact active projections
        run: |
          git add docs/refactor-v2/coordination_current_config.json docs/state/NEXT.json docs/state/agent-runtime/runtime-graph.json docs/state/v2/active-claims.json docs/state/v2/project-state.json docs/state/v2/context-pack.json docs/state/v2/graph-snapshot.json docs/continuity/CONTEXT_SURVIVAL.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'employment: materialize token35 active A10 A30 state'
          git push origin HEAD:employment/source-registry-vacancy-v3-token35-20260921

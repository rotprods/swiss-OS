name: convergence-token25-bootstrap

on:
  push:
    branches:
      - convergence/terminalization-parity-token23-20260913
    paths:
      - .github/workflows/convergence-token23-bootstrap.yml
      - scripts/material_mutation_lineage_guard.py
      - tests/test_material_mutation_lineage.py
      - docs/state/v2/claims/CLAIM-CONVERGENCE-TERMINALIZATION-025.json
      - docs/state/v2/events/EVT-20260915T082640Z-CONVERGENCE-TOKEN25-ACQUIRED.json
      - docs/state/agent-runtime/heartbeats/HB-AGENT-GPT56SOL-CONVERGENCE-025-INIT.json
      - docs/reports/convergence/TOKEN25_TERMINAL_LINEAGE_GUARD_REPAIR_2026-09-15.json

permissions:
  contents: write

concurrency:
  group: convergence-token25-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Require live token25 claim lease parity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/execution_lease_live_guard.py --receipt /tmp/execution-lease-token25-bootstrap.json

      - name: Bind coordination config to token25 lineage guard repair
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path=Path('docs/refactor-v2/coordination_current_config.json')
          data=json.loads(path.read_text())
          branch='convergence/terminalization-parity-token23-20260913'
          claim_path='docs/state/v2/claims/CLAIM-CONVERGENCE-TERMINALIZATION-025.json'
          event='docs/state/v2/events/EVT-20260915T082640Z-CONVERGENCE-TOKEN25-ACQUIRED.json'
          hb='docs/state/agent-runtime/heartbeats/HB-AGENT-GPT56SOL-CONVERGENCE-025-INIT.json'
          report='docs/reports/convergence/TOKEN25_TERMINAL_LINEAGE_GUARD_REPAIR_2026-09-15.json'
          data['branch']=branch
          data['generated_at']='2026-09-15T08:26:40Z'
          data['state']='CONVERGENCE_TERMINAL_LINEAGE_GUARD_TOKEN25_ACTIVE'
          data['open_prs']=[464]
          data['liveness_findings']=[
            'Token24 completed two-surface terminalization: branch claim RELEASED, external lease CAS-released, active_lease=null, watermark24.',
            'Token25 was immediately acquired through the same global CAS slot, physically proving successor admission without TTL waiting.',
            'Token25 is bounded to terminal lineage guard repair and convergence reseal only; domain and outbound authority remain unchanged.'
          ]
          data['next_safe_actions']=[
            'Qualify branch-aware inherited-terminal-claim filtering while preserving same-branch ambiguity fail-closed behavior.',
            'Run exact-head token25 active-state repo gauntlet.',
            'Terminalize claim25, release lease25 by CAS, require external release readback, then run final zero-writer gauntlet.',
            'Await explicit owner merge instruction; do not start B12 or outbound.'
          ]
          data['blockers']=[
            'Token25 guard repair and final zero-writer qualification are not yet complete.',
            'Explicit owner merge instruction is required before PR #464 promotion.',
            'CRM_UNIVERSE_COMPLETE remains false because RECONCILE_REQUIRED=1403.',
            'OUTBOUND remains CLOSED and send_allowed=0.'
          ]
          data['unverified_work']=[
            'Token25 active-state material lineage guard must pass end-to-end.',
            'Full exact-head repo gauntlet must pass with token25.',
            'Token25 must repeat two-surface terminalization and final zero-writer guard.',
            'Fresh-main relevant-scope drift must be checked before promotion.'
          ]
          verified=data.setdefault('verified_work',[])
          for fact in [
            'Token24 active-state repo-guard 4459 / workflow 34945752258 passed every declared gate.',
            'Token24 external lease release readback proved active_lease=null, last_lease token24 RELEASED and watermark24 before COMPLETE.',
            'Token25 was physically admitted immediately after token24 release through CAS generation14/watermark25.'
          ]:
              if fact not in verified:
                  verified.append(fact)
          for key, values in (
              ('relevant_paths',[claim_path,event,hb,report,'scripts/material_mutation_lineage_guard.py','tests/test_material_mutation_lineage.py','.github/workflows/convergence-token23-bootstrap.yml','docs/state/NEXT.json']),
              ('survival_paths',[claim_path,hb,report,'scripts/material_mutation_lineage_guard.py','docs/state/NEXT.json']),
          ):
              current=data.setdefault(key,[])
              for value in values:
                  if value not in current:
                      current.append(value)
          refs=[]
          for value in data.get('source_refs',[]):
              if value in {'claim:CLAIM-CONVERGENCE-TERMINALIZATION-024:ACTIVE','lease:coordination/execution-lease:TOKEN24:ACTIVE_CAS'}:
                  continue
              refs.append(value)
          for value in [
              'claim:CLAIM-CONVERGENCE-TERMINALIZATION-024:RELEASED',
              'lease:coordination/execution-lease:TOKEN24:RELEASED_CAS',
              'claim:CLAIM-CONVERGENCE-TERMINALIZATION-025:ACTIVE',
              'lease:coordination/execution-lease:TOKEN25:ACTIVE_CAS',
              'repair:TERMINAL_LINEAGE_BRANCH_PROVENANCE'
          ]:
              if value not in refs:
                  refs.append(value)
          data['source_refs']=refs
          graph=data.setdefault('graph',{})
          nodes=graph.setdefault('nodes',[])
          by_id={n.get('id'):n for n in nodes}
          for node_id,state in [
              ('C:CLAIM-CONVERGENCE-TERMINALIZATION-024','RELEASED_TOKEN_24_KEEP'),
              ('L:GLOBAL-EXECUTION-LEASE-024','RELEASED_CAS'),
          ]:
              if node_id in by_id:
                  by_id[node_id]['state']=state
          for node in [
              {'id':'C:CLAIM-CONVERGENCE-TERMINALIZATION-025','state':'ACTIVE_TOKEN_25','type':'Claim'},
              {'id':'L:GLOBAL-EXECUTION-LEASE-025','state':'ACTIVE_CAS','type':'ExecutionLease'},
          ]:
              if node['id'] not in by_id:
                  nodes.append(node); by_id[node['id']]=node
          for node in nodes:
              if node.get('id')=='ISSUE:54':
                  node['state']='TOKEN25_TERMINAL_LINEAGE_GUARD_REPAIR_ACTIVE'
              elif node.get('id')=='PR:464':
                  node['state']='TOKEN25_ACTIVE_REPAIR'
          edges=graph.setdefault('edges',[])
          for edge in [
              {'from':'C:CLAIM-CONVERGENCE-TERMINALIZATION-024','to':'C:CLAIM-CONVERGENCE-TERMINALIZATION-025','type':'PREDECESSOR_OF'},
              {'from':'L:GLOBAL-EXECUTION-LEASE-025','to':'C:CLAIM-CONVERGENCE-TERMINALIZATION-025','type':'SERIALIZES_WRITER'},
              {'from':'C:CLAIM-CONVERGENCE-TERMINALIZATION-025','to':'ISSUE:54','type':'REPAIRS'}
          ]:
              if edge not in edges:
                  edges.append(edge)
          path.write_text(json.dumps(data,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')
          PY

      - name: Bind NEXT to token25 active claim
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('docs/state/NEXT.json')
          data=json.loads(path.read_text())
          data['generated_at']='2026-09-15T08:26:40Z'
          data['active_claim']={
            'authority_ceiling':'CONVERGENCE_ORCHESTRATION_AND_LEASE_REPAIR_ONLY_NO_DOMAIN_OR_OUTBOUND_AUTHORITY',
            'branch':'convergence/terminalization-parity-token23-20260913',
            'claim_id':'CLAIM-CONVERGENCE-TERMINALIZATION-025',
            'fencing_token':25,
            'session_id':'SES-20260915T082640Z-CONVERGENCE-025'
          }
          data['convergence_route']='CONVERGENCE_TERMINAL_LINEAGE_GUARD_TOKEN25_ACTIVE'
          data['successor_execution_allowed']=False
          data['exact_dependency']='Token25 is the sole live convergence writer for terminal-lineage guard repair after token24 terminalization parity physically passed.'
          data['hard_blockers']=[
            'TOKEN25_TERMINAL_LINEAGE_GUARD_NOT_YET_QUALIFIED',
            'EXPLICIT_OWNER_MERGE_INSTRUCTION_REQUIRED_FOR_PR_464',
            'RECONCILE_REQUIRED_1403_NOT_ZERO',
            'GOAL_DRAIN_BLOCKS_B12_AUTOMATIC_EXECUTION',
            'OUTBOUND_CLOSED'
          ]
          data['next_safe_actions']=[
            'Run exact-head token25 active-state gauntlet.',
            'Terminalize token25 through claim release -> CAS lease release -> readback -> COMPLETE.',
            'Run final zero-writer gauntlet with inherited-other-branch lineage regression fixed.',
            'Await explicit owner merge instruction; do not start B12 or outbound.'
          ]
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          PY

      - name: Rebuild Runtime Graph
        run: |
          set -euo pipefail
          AS_OF=$(python - <<'PY'
          import json
          from pathlib import Path
          values=[]
          for path in Path('docs/state/agent-runtime/heartbeats').glob('*.json'):
              data=json.loads(path.read_text())
              value=data.get('observed_at')
              if isinstance(value,str) and value:
                  values.append(value)
          print(max(values) if values else '1970-01-01T00:00:00Z')
          PY
          )
          python scripts/rebuild_agent_runtime_graph.py --as-of "$AS_OF" --output docs/state/agent-runtime/runtime-graph.json

      - name: Rebuild V2 coordination and Context Survival
        run: |
          set -euo pipefail
          rm -rf /tmp/v2-token25
          python scripts/rebuild_v2_coordination.py --config docs/refactor-v2/coordination_current_config.json --output-dir /tmp/v2-token25
          cp /tmp/v2-token25/active-claims.json docs/state/v2/active-claims.json
          cp /tmp/v2-token25/project-state.json docs/state/v2/project-state.json
          cp /tmp/v2-token25/context-pack.json docs/state/v2/context-pack.json
          cp /tmp/v2-token25/graph-snapshot.json docs/state/v2/graph-snapshot.json
          cp /tmp/v2-token25/CONTEXT_SURVIVAL.json docs/continuity/CONTEXT_SURVIVAL.json

      - name: Assert token25 derived state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          active=json.loads(Path('docs/state/v2/active-claims.json').read_text())
          runtime=json.loads(Path('docs/state/agent-runtime/runtime-graph.json').read_text())
          nxt=json.loads(Path('docs/state/NEXT.json').read_text())
          assert [c['claim_id'] for c in active['claims']]==['CLAIM-CONVERGENCE-TERMINALIZATION-025']
          assert active['collisions']==[]
          assert active['fencing_high_watermark']==25
          assert [s['session_id'] for s in runtime['active_sessions']]==['SES-20260915T082640Z-CONVERGENCE-025']
          assert nxt['active_claim']['claim_id']=='CLAIM-CONVERGENCE-TERMINALIZATION-025'
          assert nxt['active_claim']['fencing_token']==25
          PY

      - name: Run lineage and lease regression suite
        run: |
          python -m unittest \
            tests.test_material_mutation_lineage \
            tests.test_execution_lease \
            tests.test_github_execution_lease \
            tests.test_execution_lease_live_guard \
            -v

      - name: Re-run live lease guard against rebuilt state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/execution_lease_live_guard.py --receipt /tmp/execution-lease-token25-rebuilt.json

      - name: Validate full token25 material lineage scope
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          CHANGED=$({
            git diff --name-only refs/remotes/origin/main...HEAD
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u)
          export GRAPH_V2_CHANGED_PATHS="$CHANGED"
          python scripts/material_mutation_lineage_guard.py

      - name: Commit token25 coordination projections
        run: |
          set -euo pipefail
          git add \
            docs/refactor-v2/coordination_current_config.json \
            docs/state/NEXT.json \
            docs/state/agent-runtime/runtime-graph.json \
            docs/state/v2/active-claims.json \
            docs/state/v2/project-state.json \
            docs/state/v2/context-pack.json \
            docs/state/v2/graph-snapshot.json \
            docs/continuity/CONTEXT_SURVIVAL.json
          if git diff --cached --quiet; then
            echo 'Token25 projections already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'coordination: materialize token25 lineage-guard repair state'
          git push origin HEAD:convergence/terminalization-parity-token23-20260913

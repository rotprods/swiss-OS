name: convergence-token21-terminalize

on:
  push:
    branches:
      - convergence/main-singularity
    paths:
      - .github/workflows/convergence-token21-terminalize.yml

permissions:
  contents: write

concurrency:
  group: convergence-token21-terminalize
  cancel-in-progress: false

jobs:
  terminalize:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify token21 still owns live global lease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/wave_lease_guard.py status > /tmp/lease.json
          python -c "import json; d=json.load(open('/tmp/lease.json')); a=d.get('active_lease') or {}; assert d['fencing_high_watermark']==21; assert d['expired'] is False; assert a['lease_id']=='LEASE-0479ab715ce626b5422f'; assert a['fencing_token']==21; assert a['session_id']=='SES-20260912T203915Z-CONVERGENCE-021'; assert a['state']=='ACTIVE' and a['mutation_allowed'] is True"
      - name: Materialize KEEP and terminal branch state
        run: python docs/state/agent-runtime/token21_terminalize_tmp.py
      - name: Rebuild zero-writer Runtime Graph and V2 projections
        run: |
          set -euo pipefail
          AS_OF=$(python -c "import json,pathlib; v=[json.loads(p.read_text()).get('observed_at') for p in pathlib.Path('docs/state/agent-runtime/heartbeats').glob('*.json')]; print(max(x for x in v if isinstance(x,str) and x))")
          python scripts/rebuild_agent_runtime_graph.py --as-of "$AS_OF" --output docs/state/agent-runtime/runtime-graph.json
          rm -rf /tmp/v2-token21-terminal
          python scripts/rebuild_v2_coordination.py --config docs/refactor-v2/coordination_current_config.json --output-dir /tmp/v2-token21-terminal
          cp /tmp/v2-token21-terminal/active-claims.json docs/state/v2/active-claims.json
          cp /tmp/v2-token21-terminal/project-state.json docs/state/v2/project-state.json
          cp /tmp/v2-token21-terminal/context-pack.json docs/state/v2/context-pack.json
          cp /tmp/v2-token21-terminal/graph-snapshot.json docs/state/v2/graph-snapshot.json
          cp /tmp/v2-token21-terminal/CONTEXT_SURVIVAL.json docs/continuity/CONTEXT_SURVIVAL.json
      - name: Validate terminal branch semantics before external lease release
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          CHANGED=$({ git diff --name-only refs/remotes/origin/main...HEAD; git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          export GRAPH_V2_CHANGED_PATHS="$CHANGED"
          python scripts/material_mutation_lineage_guard.py
          python scripts/rebuild_agent_runtime_graph.py --check
          rm -rf /tmp/v2-token21-terminal-check
          python scripts/rebuild_v2_coordination.py --config docs/refactor-v2/coordination_current_config.json --output-dir /tmp/v2-token21-terminal-check --check
          python -m unittest discover -s tests -p 'test_*.py'
          python -c "import json; a=json.load(open('docs/state/v2/active-claims.json')); p=json.load(open('docs/state/v2/project-state.json')); r=json.load(open('docs/state/agent-runtime/runtime-graph.json')); n=json.load(open('docs/state/NEXT.json')); assert a['claims']==[] and a['collisions']==[] and a['fencing_high_watermark']==21; assert p['active_claim_ids']==[]; assert r['active_sessions']==[]; assert n['active_claim'] is None and n['successor_execution_allowed'] is False"
      - name: Commit exact token21 terminal branch state
        run: |
          set -euo pipefail
          git add docs/state/v2/claims/CLAIM-CONVERGENCE-LINEAGE-021.json docs/state/v2/events docs/state/agent-runtime/heartbeats/HB-AGENT-GPT56SOL-CONVERGENCE-021-COMPLETE.json docs/state/agent-runtime/iterations/ITER-convergence-main-singularity-token21.json docs/refactor-v2/coordination_current_config.json docs/state/NEXT.json docs/state/NEXT_CONVERGENCE_ONLY_2026-09-12.json docs/state/v2/NEXT_CONVERGENCE_ONLY_2026-09-12.json docs/state/agent-runtime/runtime-graph.json docs/state/v2/active-claims.json docs/state/v2/project-state.json docs/state/v2/context-pack.json docs/state/v2/graph-snapshot.json docs/continuity/CONTEXT_SURVIVAL.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'coordination: terminalize token21 lineage repair KEEP'
          git push origin HEAD:convergence/main-singularity

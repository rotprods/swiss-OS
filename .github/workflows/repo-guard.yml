name: repo-guard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  materialize_token15_keep:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 446 && github.event.pull_request.head.ref == 'feat/stale-fencing-liveness-token15' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.persist.outputs.changed }}
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Materialize token15 KEEP control-plane projections
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          RECEIPT='docs/state/agent-runtime/iterations/ITER-d5f731ff191ffcfeb12e.json'
          if [[ ! -f "$RECEIPT" ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          AS_OF=$(python - <<'PY'
          import json
          from pathlib import Path
          values=[]
          for path in Path('docs/state/agent-runtime/heartbeats').glob('*.json'):
              data=json.loads(path.read_text())
              value=data.get('observed_at')
              if isinstance(value,str) and value:
                  values.append(value)
          print(max(values) if values else '1970-01-01T00:00:00Z')
          PY
          )
          python scripts/rebuild_agent_runtime_graph.py --as-of "$AS_OF" --output docs/state/agent-runtime/runtime-graph.json
          rm -rf /tmp/v2-token15-keep
          python scripts/rebuild_v2_coordination.py --config docs/refactor-v2/coordination_current_config.json --output-dir /tmp/v2-token15-keep
          cp /tmp/v2-token15-keep/active-claims.json docs/state/v2/active-claims.json
          cp /tmp/v2-token15-keep/project-state.json docs/state/v2/project-state.json
          cp /tmp/v2-token15-keep/context-pack.json docs/state/v2/context-pack.json
          cp /tmp/v2-token15-keep/graph-snapshot.json docs/state/v2/graph-snapshot.json
          cp /tmp/v2-token15-keep/CONTEXT_SURVIVAL.json docs/continuity/CONTEXT_SURVIVAL.json

          mapfile -t changed_paths < <(git diff --name-only)
          allowed=(
            'docs/state/agent-runtime/runtime-graph.json'
            'docs/state/v2/active-claims.json'
            'docs/state/v2/project-state.json'
            'docs/state/v2/context-pack.json'
            'docs/state/v2/graph-snapshot.json'
            'docs/continuity/CONTEXT_SURVIVAL.json'
          )
          for path in "${changed_paths[@]}"; do
            ok=false
            for candidate in "${allowed[@]}"; do
              [[ "$path" == "$candidate" ]] && ok=true && break
            done
            if [[ "$ok" != true ]]; then
              echo "unexpected materializer mutation: $path" >&2
              exit 1
            fi
          done

          if ((${#changed_paths[@]} == 0)); then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add "${allowed[@]}"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'coord: materialize token15 KEEP projections'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          echo 'changed=true' >> "$GITHUB_OUTPUT"

  guard:
    needs: [materialize_token15_keep]
    if: ${{ always() && (needs.materialize_token15_keep.result == 'skipped' || needs.materialize_token15_keep.outputs.changed == 'false') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Public repository guard
        run: python scripts/repo_guard.py
      - name: Stable contract drift guard
        run: python scripts/system_contract_guard.py
      - name: Agent improvement / GRAPH-REFACTOR-V2 guard
        run: python scripts/agent_improvement_guard.py
      - name: Material mutation lineage guard
        run: python scripts/material_mutation_lineage_guard.py
      - name: Stale branch fencing guard
        run: python scripts/stale_branch_fencing_guard.py --receipt /tmp/stale-branch-fencing.json
      - name: Heartbeat liveness guard
        run: python scripts/heartbeat_liveness_guard.py --receipt /tmp/heartbeat-liveness.json
      - name: Preserve concurrency/liveness receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graph-v2-concurrency-liveness-${{ github.run_id }}
          path: |
            /tmp/stale-branch-fencing.json
            /tmp/heartbeat-liveness.json
          if-no-files-found: ignore
          retention-days: 14
      - name: GitHub platform enforcement truth guard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/platform_enforcement_guard.py --receipt /tmp/platform-enforcement-readback.json
      - name: Preserve platform readback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-enforcement-readback-${{ github.run_id }}
          path: /tmp/platform-enforcement-readback.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Build Agent Runtime Graph recovery candidate
        run: |
          AS_OF=$(python - <<'PY'
          import json
          from pathlib import Path
          values=[]
          for path in Path('docs/state/agent-runtime/heartbeats').glob('*.json'):
              data=json.loads(path.read_text())
              value=data.get('observed_at')
              if isinstance(value,str) and value:
                  values.append(value)
          print(max(values) if values else '1970-01-01T00:00:00Z')
          PY
          )
          python scripts/rebuild_agent_runtime_graph.py --as-of "$AS_OF" --output /tmp/agent-runtime-graph.json
      - name: Preserve Agent Runtime Graph candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-runtime-graph-${{ github.run_id }}
          path: /tmp/agent-runtime-graph.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Deterministic Agent Runtime Graph guard
        run: python scripts/rebuild_agent_runtime_graph.py --check
      - name: Deterministic V2 coordination rebuild guard
        run: python scripts/rebuild_v2_coordination.py --config docs/refactor-v2/coordination_current_config.json --output-dir /tmp/v2-coordination-rebuild --check
      - name: Preserve coordination rebuild candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-coordination-rebuild-${{ github.run_id }}
          path: /tmp/v2-coordination-rebuild
          if-no-files-found: ignore
          retention-days: 14
      - name: V2 coordination contract guard
        run: python scripts/v2_contract_guard.py
      - name: V2 forward event contract guard
        run: python scripts/v2_forward_event_guard.py
      - name: Context survival / compaction checkpoint guard
        run: python scripts/context_survival_guard.py
      - name: V2 empirical recovery and death drill
        run: python scripts/v2_empirical_drill.py --receipt /tmp/v2-empirical-receipt.json
      - name: CWP candidate lineage guard
        run: python -m swiss_os.cwp_lineage_guard
      - name: Durable handoff frontier guard
        run: python scripts/handoff_frontier_guard.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Manifest semantics canary
        run: python -m swiss_os.cli manifest validate tests/fixtures/manifest_superseded.json

name: repo-guard

on:
  pull_request:

jobs:
  refresh_token15_liveness:
    if: ${{ github.event.pull_request.number == 446 && github.event.pull_request.head.ref == 'feat/stale-fencing-liveness-token15' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Refresh token15 heartbeat and materialize deterministic projections
        shell: bash
        run: |
          set -euo pipefail
          OBSERVED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          HB_SUFFIX=$(date -u +'%H%M%S')
          HB_PATH="docs/state/agent-runtime/heartbeats/HB-AGENT-GPT56SOL-GRAPHV2-001-SES-015-${HB_SUFFIX}.json"
          export OBSERVED_AT HB_PATH
          python - <<'PY'
          import json, os
          from pathlib import Path

          observed_at=os.environ['OBSERVED_AT']
          hb_path=Path(os.environ['HB_PATH'])
          old_hb='docs/state/agent-runtime/heartbeats/HB-AGENT-GPT56SOL-GRAPHV2-001-SES-015-112000.json'
          receipt='ITER-d5f731ff191ffcfeb12e'
          heartbeat={
            'heartbeat_id': hb_path.stem,
            'project_id':'SWITZERLAND_JOB_OS',
            'agent_id':'AGENT-GPT56SOL-GRAPHV2-001',
            'session_id':'SES-20260902T112000Z-GRAPHV2-FENCING-LIVENESS-015',
            'workstream_id':'WS-GRAPHV2-FENCING-LIVENESS',
            'objective_id':'OBJ-STALE-FENCING-LIVE-HEARTBEAT-GUARDS',
            'goal_ids':['G-0001'],
            'plan_id':'PLAN-GRAPHV2-FENCING-LIVENESS-001',
            'task_id':'TASK-FENCING-LIVENESS-GUARDS-001',
            'claim_id':'CLAIM-GRAPHV2-FENCING-LIVENESS-015',
            'fencing_token':15,
            'observed_at':observed_at,
            'state':'ACTIVE',
            'branch':'feat/stale-fencing-liveness-token15',
            'worktree':'.worktrees/stale-fencing-liveness-token15',
            'base_main_sha':'f85694b16b31fe1014373d0bb10b8ec94c8c82b1',
            'authority_ceiling':'REPO_CONCURRENCY_LIVENESS_GUARDS_ONLY_NO_DOMAIN_OR_EXTERNAL_MUTATION',
            'graph_program':'GRAPH-REFACTOR-V2',
            'pr_number':446,
            'current_iteration_id':receipt,
            'next_safe_action':'KEEP is durably persisted from full-green run 33626428413. Re-run the complete gauntlet with this fresh heartbeat, merge PR #446 only from fresh main with expected tested head SHA, then release token15 in a bounded post-merge wave and prove zero active claims/sessions.'
          }
          hb_path.write_text(json.dumps(heartbeat,separators=(',',':'))+'\n')

          cfg_path=Path('docs/refactor-v2/coordination_current_config.json')
          cfg=json.loads(cfg_path.read_text())
          cfg['generated_at']=observed_at
          for key in ('relevant_paths','survival_paths'):
            cfg[key]=[str(hb_path) if x==old_hb else x for x in cfg[key]]
          cfg['source_refs']=[
            'main:f85694b16b31fe1014373d0bb10b8ec94c8c82b1',
            'issue:#437:OPEN',
            'issue:#441:OPEN_PLATFORM_BLOCKER',
            'pr:#446:OPEN',
            'claim:CLAIM-GRAPHV2-FENCING-LIVENESS-015:ACTIVE',
            'actions:33626428413:FULL_GREEN_KEEP',
            f'iteration:{receipt}:KEEP'
          ]
          cfg['verified_work']=[
            'Token14 platform-truth work is merged and terminalized with zero active token14 claims/sessions on main f85694b16b31fe1014373d0bb10b8ec94c8c82b1.',
            'Token15 was acquired from exact idle main with fencing token15 and explicit lifecycle causation bound to CLAIM-GRAPHV2-FENCING-LIVENESS-015.',
            'The stale-branch fencing guard rejects obsolete token acquisition against canonical live-main watermark and passes its adversarial tests.',
            'The wall-clock heartbeat liveness guard passes with injectable time and remains separate from deterministic pinned-as-of Runtime Graph rebuilds.',
            'PR #446 repo-guard run 33626428413 completed the full guard/death/unit/canary gauntlet green and iteration ITER-d5f731ff191ffcfeb12e is durably KEEP-qualified.',
            'No hotel, CRM, H-ID, candidate, application, outbound or Gmail authority has been widened.'
          ]
          cfg['unverified_work']=[
            'The refreshed token15 heartbeat and its derived Runtime Graph/coordination/Context Survival projections must pass the complete gauntlet on the same final tested head.',
            'PR #446 must merge from fresh main with the expected tested head SHA and token15 must then be released in an explicit bounded post-merge wave to zero active writers.',
            'The hourly heartbeat watchdog must remain observational/fail-closed and must not perform domain or external mutation.',
            'Platform pre-receive prevention remains external until issue #441 is resolved and live readback verifies controls.'
          ]
          cfg['next_safe_actions']=[
            'Run the complete repo/death/unit/canary gauntlet on the refreshed token15 heartbeat and require stale-fencing plus heartbeat-liveness guards green in the same tested head.',
            'Merge PR #446 only from fresh main with expected tested head SHA.',
            'Release token15 in a bounded terminal wave, prove zero active claims/sessions and preserve production_authority_allowed=false while #441 remains open.'
          ]
          cfg_path.write_text(json.dumps(cfg,separators=(',',':'))+'\n')
          PY

          python scripts/rebuild_agent_runtime_graph.py --as-of "$OBSERVED_AT" --output docs/state/agent-runtime/runtime-graph.json

          # Project final state against the canonical repo-guard, not this temporary materializer.
          git show f76079487a6618de8ae4dbbd67abb1d0cb84eee9:.github/workflows/repo-guard.yml > .github/workflows/repo-guard.yml
          rm -rf /tmp/v2-token15-refresh
          python scripts/rebuild_v2_coordination.py --config docs/refactor-v2/coordination_current_config.json --output-dir /tmp/v2-token15-refresh
          cp /tmp/v2-token15-refresh/active-claims.json docs/state/v2/active-claims.json
          cp /tmp/v2-token15-refresh/project-state.json docs/state/v2/project-state.json
          cp /tmp/v2-token15-refresh/context-pack.json docs/state/v2/context-pack.json
          cp /tmp/v2-token15-refresh/graph-snapshot.json docs/state/v2/graph-snapshot.json
          cp /tmp/v2-token15-refresh/CONTEXT_SURVIVAL.json docs/continuity/CONTEXT_SURVIVAL.json

          git add "$HB_PATH" docs/refactor-v2/coordination_current_config.json \
            docs/state/agent-runtime/runtime-graph.json \
            docs/state/v2/active-claims.json docs/state/v2/project-state.json \
            docs/state/v2/context-pack.json docs/state/v2/graph-snapshot.json \
            docs/continuity/CONTEXT_SURVIVAL.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'coord: refresh token15 liveness [skip ci]'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

name: convergence-token28-next-reconcile-once

on:
  push:
    branches: [convergence/postmerge-recovery-token28-20260915]
    paths:
      - '.github/workflows/convergence-runtime-graph-materialize.yml'

permissions:
  contents: write

concurrency:
  group: convergence-token28-next-reconcile-once
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prove token28 ownership
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'convergence/postmerge-recovery-token28-20260915'
          python scripts/execution_lease_live_guard.py
          python scripts/heartbeat_liveness_guard.py
      - name: Reconcile root NEXT to durable active claim
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          next_path=Path('docs/state/NEXT.json')
          active_path=Path('docs/state/v2/active-claims.json')
          root=json.loads(next_path.read_text())
          active=json.loads(active_path.read_text())
          claims=active.get('claims',[])
          assert len(claims)==1
          claim=claims[0]
          assert claim['claim_id']=='CLAIM-CONVERGENCE-POSTMERGE-028'
          assert claim['fencing_token']==28
          root['active_claim']={
              'claim_id':claim['claim_id'],
              'fencing_token':claim['fencing_token'],
              'authority_ceiling':claim['authority_ceiling'],
          }
          root['generated_at']='2026-09-15T15:15:59Z'
          root['parent_git_sha']='38d52d60f109f373741ce95021a60b03ea69dffc'
          root['convergence_route']='CONVERGENCE_TOKEN28_ACTIVE_POSTMERGE_RECOVERY'
          root['exact_dependency']='Token28 is the sole active convergence writer, bound to current main 38d52d60 and E4. Complete PR #466 qualification, then terminalize claim28 and externally release lease28 before COMPLETE. B12 and OUTBOUND remain blocked.'
          root['hard_blockers']=[
              'PR_466_EXACT_HEAD_FULL_GAUNTLET_REQUIRED',
              'TOKEN28_TWO_SURFACE_TERMINALIZATION_REQUIRED',
              'POST_MERGE_MAIN_GAUNTLET_REQUIRED_BEFORE_ISSUE54_CLOSE',
              'RECONCILE_REQUIRED_1403_NOT_ZERO',
              'GOAL_DRAIN_BLOCKS_B12_AUTOMATIC_EXECUTION',
              'OUTBOUND_CLOSED'
          ]
          root['next_safe_actions']=[
              'Run exact-head PR #466 gauntlet with token28 heartbeat and lease fresh.',
              'On full green persist token28 KEEP and release claim28 while withholding COMPLETE.',
              'CAS-release external lease28 and require active_lease=null readback.',
              'Emit COMPLETE only after both surfaces are terminal, then run final zero-writer gauntlet.',
              'Merge only expected qualified head and require post-merge main green; do not start B12 or outbound.'
          ]
          next_path.write_text(json.dumps(root,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          PY
      - name: Rebuild deterministic V2 and Context Survival
        run: |
          set -euo pipefail
          rm -rf /tmp/v2-token28 /tmp/v2-token28-check
          python scripts/rebuild_v2_coordination.py --config docs/refactor-v2/coordination_current_config.json --output-dir /tmp/v2-token28
          cp /tmp/v2-token28/active-claims.json docs/state/v2/active-claims.json
          cp /tmp/v2-token28/project-state.json docs/state/v2/project-state.json
          cp /tmp/v2-token28/context-pack.json docs/state/v2/context-pack.json
          cp /tmp/v2-token28/graph-snapshot.json docs/state/v2/graph-snapshot.json
          cp /tmp/v2-token28/CONTEXT_SURVIVAL.json docs/continuity/CONTEXT_SURVIVAL.json
          python scripts/rebuild_v2_coordination.py --config docs/refactor-v2/coordination_current_config.json --output-dir /tmp/v2-token28-check --check
          python scripts/context_survival_guard.py
          python -m unittest tests.test_context_survival_guard -v
      - name: Commit NEXT reconciliation and self-delete
        run: |
          set -euo pipefail
          git rm .github/workflows/convergence-runtime-graph-materialize.yml
          git add docs/state/NEXT.json docs/state/v2/active-claims.json docs/state/v2/project-state.json docs/state/v2/context-pack.json docs/state/v2/graph-snapshot.json docs/continuity/CONTEXT_SURVIVAL.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'coordination: reconcile token28 NEXT pointer and derived state'
          git push origin HEAD:convergence/postmerge-recovery-token28-20260915

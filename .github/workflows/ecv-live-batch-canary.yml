name: ecv-live-batch-canary

on:
  workflow_dispatch:
    inputs:
      batch_path:
        description: Repository-relative CMI-WORK-PACKET JSON path to verify
        required: true
        type: string
        default: docs/state/CMI_WORK_BATCH_0001_33206402141.json
  push:
    branches:
      - main
    paths:
      - 'docs/state/CMI_WORK_BATCH_*.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve batch path
        id: batch
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_BATCH_PATH: ${{ inputs.batch_path }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            batch_path="$DISPATCH_BATCH_PATH"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            mapfile -t changed_batches < <(
              git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- 'docs/state/CMI_WORK_BATCH_*.json'
            )
            if [[ ${#changed_batches[@]} -ne 1 ]]; then
              echo "push-triggered ECV requires exactly one changed CMI work batch; found ${#changed_batches[@]}" >&2
              printf '%s\n' "${changed_batches[@]}" >&2
              exit 2
            fi
            batch_path="${changed_batches[0]}"
          else
            echo "unsupported event: $EVENT_NAME" >&2
            exit 2
          fi

          case "$batch_path" in
            docs/state/CMI_WORK_BATCH_*.json) ;;
            *) echo "batch_path must be a CMI work-batch JSON under docs/state" >&2; exit 2 ;;
          esac
          test -f "$batch_path"
          echo "batch_path=$batch_path" >> "$GITHUB_OUTPUT"
      - name: Verify exact-current work batch
        shell: bash
        env:
          BATCH_PATH: ${{ steps.batch.outputs.batch_path }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          PYTHONPATH=src python -m swiss_os.exact_current_verify verify \
            "$BATCH_PATH" \
            --out .artifacts/ECV_RESULT.json \
            --delay 3.0 \
            --timeout 30 \
            --attempts 3 \
            > .artifacts/ECV_RUNTIME.json
          PYTHONPATH=src python -m swiss_os.exact_current_verify validate \
            .artifacts/ECV_RESULT.json \
            > .artifacts/ECV_VALIDATE.json
      - name: Safety assertions
        shell: bash
        run: |
          python - <<'PY'
          import json
          p=json.load(open('.artifacts/ECV_RESULT.json'))
          assert p['authority_advanced'] is False
          assert p['h_id_allocations'] == 0 and type(p['h_id_allocations']) is int
          assert p['outbound'] == 'CLOSED'
          assert p['send_allowed'] == 0 and type(p['send_allowed']) is int
          assert type(p['items_count']) is int and p['items_count'] > 0
          assert p['items_count'] == p['results_count']
          print(json.dumps({'items_count':p['items_count'],'counts':p['counts_by_state'],'all_verified':p['all_verified'],'packet_sha256':p['packet_sha256']},indent=2,sort_keys=True))
          PY
      - name: Upload ECV evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecv-live-batch-evidence-${{ github.run_id }}
          path: .artifacts
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

name: agent-heartbeat-watchdog

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  liveness:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Evaluate wall-clock agent heartbeat liveness
        run: python scripts/heartbeat_liveness_guard.py --receipt /tmp/heartbeat-liveness.json
      - name: Preserve liveness receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heartbeat-liveness-${{ github.run_id }}
          path: /tmp/heartbeat-liveness.json
          if-no-files-found: error
          retention-days: 14

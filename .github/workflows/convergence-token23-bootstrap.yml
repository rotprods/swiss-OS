name: convergence-token24-bootstrap

on:
  push:
    branches:
      - convergence/terminalization-parity-token23-20260913
    paths:
      - .github/workflows/convergence-token23-bootstrap.yml
      - docs/state/v2/claims/CLAIM-CONVERGENCE-TERMINALIZATION-023.json
      - docs/state/v2/claims/CLAIM-CONVERGENCE-TERMINALIZATION-024.json
      - docs/state/v2/events/EVT-20260915T080341Z-CONVERGENCE-TOKEN23-SUPERSEDED.json
      - docs/state/v2/events/EVT-20260915T080341Z-CONVERGENCE-TOKEN24-ACQUIRED.json
      - docs/state/agent-runtime/heartbeats/HB-AGENT-GPT56SOL-CONVERGENCE-023-SUPERSEDED.json
      - docs/state/agent-runtime/heartbeats/HB-AGENT-GPT56SOL-CONVERGENCE-024-INIT.json
      - docs/reports/convergence/TOKEN24_STALE_LEASE_TAKEOVER_2026-09-15.json

permissions:
  contents: write

concurrency:
  group: convergence-token24-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify token24 raw claim matches live global lease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/execution_lease_live_guard.py --receipt /tmp/execution-lease-token24-bootstrap.json

      - name: Bind coordination config to token24 stale-recovery lineage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path=Path('docs/refactor-v2/coordination_current_config.json')
          data=json.loads(path.read_text())
          branch='convergence/terminalization-parity-token23-20260913'
          hb='docs/state/agent-runtime/heartbeats/HB-AGENT-GPT56SOL-CONVERGENCE-024-INIT.json'
          event='docs/state/v2/events/EVT-20260915T080341Z-CONVERGENCE-TOKEN24-ACQUIRED.json'
          claim_path='docs/state/v2/claims/CLAIM-CONVERGENCE-TERMINALIZATION-024.json'
          report='docs/reports/convergence/TOKEN24_STALE_LEASE_TAKEOVER_2026-09-15.json'

          data['branch']=branch
          data['generated_at']='2026-09-15T08:03:41Z'
          data['state']='CONVERGENCE_TERMINALIZATION_PARITY_TOKEN24_ACTIVE'
          data['open_prs']=[464]
          data['liveness_findings']=[
            'Token23 Git claim remained ACTIVE after its global lease expired at 2026-09-13T21:03:30Z; it is superseded and cannot be reused or renewed.',
            'Token24 is the sole active convergence writer under global CAS lease LEASE-45e1fa9f3f94a7a22521, acquired at 2026-09-15T08:03:41Z.',
            'This wave changes orchestration/continuity only; operational authority remains E4/690 with H-0691 unallocated and OUTBOUND CLOSED.'
          ]
          data['next_safe_actions']=[
            'Require token24 raw claim/event/heartbeat parity with the live global lease.',
            'Run targeted lease regressions plus the exact-head repo gauntlet.',
            'Terminalize claim24 only after green qualification.',
            'Release token24 via CAS and require active_lease=null plus last_lease token24 RELEASED readback before COMPLETE.',
            'Do not promote convergence implementation until terminalization-parity acceptance is physically proven.'
          ]
          data['resume_contract']=[
            'verify live main remains 3c902a791be0e8df1db564034e211ea90c41f1b3 or an ancestry-safe descendant with no relevant-scope drift',
            'read coordination/execution-lease current.json and require token24/session024/parent-main/E4 parity plus live TTL',
            'replay claims/events and require CLAIM-CONVERGENCE-TERMINALIZATION-024 as the sole active claim with fencing token24',
            'verify predecessor CLAIM-CONVERGENCE-TERMINALIZATION-023 is SUPERSEDED because its lease expired',
            'verify E4/690, H-0691 unallocated, terminal mappings 658 and RECONCILE_REQUIRED 1403',
            'keep B12 backlog-only and OUTBOUND=CLOSED/send_allowed=0',
            'require exact Runtime Graph/V2/Context Survival equality before qualification',
            'terminalization is incomplete until claim24 terminal state AND external token24 release/readback both pass'
          ]
          data['blockers']=[
            'Issue #54 is not closable until token24 terminal claim state and external lease release/readback pass together.',
            'The global execution-lease/CAS contract remains candidate-only until a separately authorized promotion.',
            'CRM_UNIVERSE_COMPLETE remains false because RECONCILE_REQUIRED=1403; this repair does not authorize B12 execution or authority promotion.',
            'OUTBOUND remains CLOSED and send_allowed=0.'
          ]
          data['unverified_work']=[
            'Exact-head token24 active-state tests must pass.',
            'Exact-head full repo-guard must pass.',
            'Token24 claim/heartbeat must terminalize after qualification.',
            'External token24 lease must release by CAS and read back active_lease=null.',
            'Fresh-main relevant-scope drift must be checked before any promotion decision.'
          ]
          verified=data.setdefault('verified_work',[])
          fact='2026-09-15 freshness barrier reproduced token23 claim ACTIVE after lease expiry and recovered with a new token24 run/session via GitHub blob-SHA CAS; no domain/outbound authority changed.'
          if fact not in verified:
              verified.append(fact)

          for key, values in (
              ('relevant_paths',[claim_path,event,hb,report,'docs/state/v2/claims/CLAIM-CONVERGENCE-TERMINALIZATION-023.json','docs/state/v2/events/EVT-20260915T080341Z-CONVERGENCE-TOKEN23-SUPERSEDED.json','docs/state/agent-runtime/heartbeats/HB-AGENT-GPT56SOL-CONVERGENCE-023-SUPERSEDED.json','tests/test_execution_lease_live_guard.py','scripts/execution_lease_live_guard.py','docs/operations/EXECUTION_LEASE_PROTOCOL.md','.github/workflows/convergence-token23-bootstrap.yml','docs/state/NEXT.json']),
              ('survival_paths',[claim_path,hb,report,'docs/operations/EXECUTION_LEASE_PROTOCOL.md','docs/state/NEXT.json']),
          ):
              current=data.setdefault(key,[])
              for value in values:
                  if value not in current:
                      current.append(value)

          refs=[]
          for value in data.get('source_refs',[]):
              if value in {'claim:CLAIM-CONVERGENCE-TERMINALIZATION-023:ACTIVE','lease:coordination/execution-lease:TOKEN23:ACTIVE_CAS'}:
                  continue
              refs.append(value)
          for value in [
              'claim:CLAIM-CONVERGENCE-TERMINALIZATION-023:SUPERSEDED_EXPIRED_LEASE',
              'lease:coordination/execution-lease:TOKEN23:EXPIRED_TAKEN_OVER',
              'claim:CLAIM-CONVERGENCE-TERMINALIZATION-024:ACTIVE',
              'lease:coordination/execution-lease:TOKEN24:ACTIVE_CAS',
              'repair:TERMINALIZATION_PARITY',
              'recovery:STALE_LEASE_TOKEN23_TO_TOKEN24'
          ]:
              if value not in refs:
                  refs.append(value)
          data['source_refs']=refs

          graph=data.setdefault('graph',{})
          nodes=graph.setdefault('nodes',[])
          by_id={n.get('id'):n for n in nodes}
          if 'C:CLAIM-CONVERGENCE-TERMINALIZATION-023' in by_id:
              by_id['C:CLAIM-CONVERGENCE-TERMINALIZATION-023']['state']='SUPERSEDED_EXPIRED_LEASE'
          if 'L:GLOBAL-EXECUTION-LEASE-023' in by_id:
              by_id['L:GLOBAL-EXECUTION-LEASE-023']['state']='EXPIRED_TAKEN_OVER'
          for node in [
              {'id':'C:CLAIM-CONVERGENCE-TERMINALIZATION-024','state':'ACTIVE_TOKEN_24','type':'Claim'},
              {'id':'L:GLOBAL-EXECUTION-LEASE-024','state':'ACTIVE_CAS','type':'ExecutionLease'},
          ]:
              if node['id'] not in by_id:
                  nodes.append(node)
                  by_id[node['id']]=node
          edges=graph.setdefault('edges',[])
          for edge in [
              {'from':'C:CLAIM-CONVERGENCE-TERMINALIZATION-023','to':'C:CLAIM-CONVERGENCE-TERMINALIZATION-024','type':'PREDECESSOR_OF'},
              {'from':'L:GLOBAL-EXECUTION-LEASE-024','to':'C:CLAIM-CONVERGENCE-TERMINALIZATION-024','type':'SERIALIZES_WRITER'},
              {'from':'C:CLAIM-CONVERGENCE-TERMINALIZATION-024','to':'ISSUE:54','type':'REPAIRS'},
          ]:
              if edge not in edges:
                  edges.append(edge)
          for node in nodes:
              if node.get('id')=='ISSUE:54':
                  node['state']='TOKEN24_TERMINALIZATION_PARITY_RECOVERY_ACTIVE'

          path.write_text(json.dumps(data,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')
          PY

      - name: Bind NEXT to token24 active claim
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path=Path('docs/state/NEXT.json')
          data=json.loads(path.read_text())
          data['active_claim']={
            'authority_ceiling':'CONVERGENCE_ORCHESTRATION_AND_LEASE_REPAIR_ONLY_NO_DOMAIN_OR_OUTBOUND_AUTHORITY',
            'branch':'convergence/terminalization-parity-token23-20260913',
            'claim_id':'CLAIM-CONVERGENCE-TERMINALIZATION-024',
            'fencing_token':24,
            'session_id':'SES-20260915T080341Z-CONVERGENCE-024'
          }
          data['convergence_route']='CONVERGENCE_TERMINALIZATION_PARITY_TOKEN24_ACTIVE'
          data['generated_at']='2026-09-15T08:03:41Z'
          data['exact_dependency']='Token24 is the sole live convergence writer after stale token23 lease recovery; CRM remains unresolved at 1403 and B12 is not authorized.'
          data['hard_blockers']=[
            'TOKEN24_TERMINALIZATION_PARITY_NOT_YET_QUALIFIED',
            'EXPLICIT_OWNER_MERGE_INSTRUCTION_REQUIRED_FOR_PR_464',
            'RECONCILE_REQUIRED_1403_NOT_ZERO',
            'GOAL_DRAIN_BLOCKS_B12_AUTOMATIC_EXECUTION',
            'OUTBOUND_CLOSED'
          ]
          data['next_safe_actions']=[
            'Run exact-head full gauntlet under live global lease token24.',
            'Terminalize claim24 branch projections only after green qualification.',
            'Release token24 CAS lease and require active_lease=null plus last_lease token24 RELEASED readback before COMPLETE.',
            'Re-run zero-claim live lease guard after release.',
            'Re-read live main for relevant-scope drift.',
            'Await explicit owner merge instruction; do not start B12 or another feature wave.'
          ]
          data['successor_execution_allowed']=False
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          PY

      - name: Rebuild Runtime Graph
        run: |
          set -euo pipefail
          AS_OF=$(python - <<'PY'
          import json
          from pathlib import Path
          values=[]
          for path in Path('docs/state/agent-runtime/heartbeats').glob('*.json'):
              data=json.loads(path.read_text())
              value=data.get('observed_at')
              if isinstance(value,str) and value:
                  values.append(value)
          print(max(values) if values else '1970-01-01T00:00:00Z')
          PY
          )
          python scripts/rebuild_agent_runtime_graph.py --as-of "$AS_OF" --output docs/state/agent-runtime/runtime-graph.json

      - name: Rebuild V2 coordination and Context Survival
        run: |
          set -euo pipefail
          rm -rf /tmp/v2-token24
          python scripts/rebuild_v2_coordination.py --config docs/refactor-v2/coordination_current_config.json --output-dir /tmp/v2-token24
          cp /tmp/v2-token24/active-claims.json docs/state/v2/active-claims.json
          cp /tmp/v2-token24/project-state.json docs/state/v2/project-state.json
          cp /tmp/v2-token24/context-pack.json docs/state/v2/context-pack.json
          cp /tmp/v2-token24/graph-snapshot.json docs/state/v2/graph-snapshot.json
          cp /tmp/v2-token24/CONTEXT_SURVIVAL.json docs/continuity/CONTEXT_SURVIVAL.json

      - name: Assert token24 derived state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          active=json.loads(Path('docs/state/v2/active-claims.json').read_text())
          runtime=json.loads(Path('docs/state/agent-runtime/runtime-graph.json').read_text())
          nxt=json.loads(Path('docs/state/NEXT.json').read_text())
          assert [c['claim_id'] for c in active['claims']]==['CLAIM-CONVERGENCE-TERMINALIZATION-024']
          assert active['collisions']==[]
          assert active['fencing_high_watermark']==24
          assert [s['session_id'] for s in runtime['active_sessions']]==['SES-20260915T080341Z-CONVERGENCE-024']
          assert nxt['active_claim']['claim_id']=='CLAIM-CONVERGENCE-TERMINALIZATION-024'
          assert nxt['active_claim']['fencing_token']==24
          PY

      - name: Run bounded lease regression suite
        run: |
          python -m unittest \
            tests.test_execution_lease \
            tests.test_github_execution_lease \
            tests.test_execution_lease_live_guard \
            -v

      - name: Re-run live lease guard against rebuilt state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/execution_lease_live_guard.py --receipt /tmp/execution-lease-token24-rebuilt.json

      - name: Validate full token24 material lineage scope
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          CHANGED=$({
            git diff --name-only refs/remotes/origin/main...HEAD
            git diff --name-only
            git ls-files --others --exclude-standard
          } | sort -u)
          export GRAPH_V2_CHANGED_PATHS="$CHANGED"
          python scripts/material_mutation_lineage_guard.py

      - name: Commit token24 coordination projections
        run: |
          set -euo pipefail
          git add \
            docs/refactor-v2/coordination_current_config.json \
            docs/state/NEXT.json \
            docs/state/agent-runtime/runtime-graph.json \
            docs/state/v2/active-claims.json \
            docs/state/v2/project-state.json \
            docs/state/v2/context-pack.json \
            docs/state/v2/graph-snapshot.json \
            docs/continuity/CONTEXT_SURVIVAL.json
          if git diff --cached --quiet; then
            echo 'Token24 projections already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'coordination: materialize token24 stale-recovery state'
          git push origin HEAD:convergence/terminalization-parity-token23-20260913

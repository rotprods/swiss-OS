name: convergence-token32-terminal-projections

on:
  push:
    branches: [convergence/postmerge-recovery-token32-20260917]
    paths:
      - '.github/workflows/convergence-runtime-graph-materialize.yml'
      - 'docs/state/v2/claims/CLAIM-CONVERGENCE-POSTMERGE-032.json'
      - 'docs/state/v2/events/EVT-20260917T115600Z-CONVERGENCE-TOKEN32-CLAIM-RELEASED.json'
      - 'docs/state/agent-runtime/heartbeats/HB-AGENT-GPT56SOL-SWARM-036-COMPLETE.json'
      - 'docs/state/agent-runtime/iterations/ITER-convergence-postmerge-recovery-token32.json'

permissions:
  contents: write

concurrency:
  group: convergence-token32-terminal-projections
  cancel-in-progress: false

jobs:
  terminalize:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Require zero-claim plus released external lease parity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/execution_lease_live_guard.py --receipt /tmp/execution-lease-token32-terminal.json
      - name: Finalize token32 convergence semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          main='d684852a8560adf5473dce1e621fc5c83c1a42a6'
          claim='CLAIM-CONVERGENCE-POSTMERGE-032'
          complete_hb='docs/state/agent-runtime/heartbeats/HB-AGENT-GPT56SOL-SWARM-036-COMPLETE.json'
          active_hb='docs/state/agent-runtime/heartbeats/HB-AGENT-GPT56SOL-SWARM-036-114100.json'
          iteration='docs/state/agent-runtime/iterations/ITER-convergence-postmerge-recovery-token32.json'

          p=Path('docs/refactor-v2/coordination_current_config.json')
          d=json.loads(p.read_text())
          d['base_main_sha']=main
          d['branch']='convergence/postmerge-recovery-token32-20260917'
          d['generated_at']='2026-09-17T11:58:00Z'
          d['state']='CONVERGENCE_TOKEN32_RELEASED_AWAITING_FINAL_ZERO_WRITER_GAUNTLET'
          d['open_prs']=[466,471,472]
          d['blockers']=[
            'One final exact-head zero-writer repository gauntlet must pass on terminal token32 projections.',
            'PR #472 promotion remains blocked by the existing owner/platform authority gate.',
            'GitHub main protection/rulesets are not yet platform-enforced as required by #441.',
            'CRM_UNIVERSE_COMPLETE remains false at RECONCILE_REQUIRED=1403; B12 and OUTBOUND remain blocked.'
          ]
          d['next_safe_actions']=[
            'Require zero active claims and zero active runtime sessions with fencing high-watermark32.',
            'Run the final exact-head terminal-state repository gauntlet.',
            'Re-read live main for relevant-scope drift after final CI.',
            'Stop at the owner/platform promotion gate; do not self-authorize merge or outbound.'
          ]
          d['liveness_findings']=[
            'Token31 was recovered death-safely after lease expiry plus heartbeat staleness; it remains terminal SUPERSEDED.',
            'Token32 exact-head active-state repo-guard 35218123802 passed every declared gate.',
            'Claim32 RELEASED at 2026-09-17T11:56:00Z before external lease release.',
            'External lease32 was CAS-released at commit a80ce20da1c8ee04afc80e2c289baf95d528ccac and read back active_lease=null, last_lease token32 RELEASED, watermark32.',
            'Heartbeat32 COMPLETE was published only after external release readback. Domain authority remains E4/690 and OUTBOUND CLOSED.'
          ]

          refs=[]
          for v in d.get('source_refs',[]):
              if not isinstance(v,str):
                  continue
              if v in {
                'claim:CLAIM-CONVERGENCE-POSTMERGE-032:ACTIVE',
                'lease:coordination/execution-lease:TOKEN32:ACTIVE_CAS'
              }:
                  continue
              refs.append(v)
          refs += [
            'main:'+main,
            'claim:CLAIM-CONVERGENCE-POSTMERGE-031:SUPERSEDED',
            'claim:CLAIM-CONVERGENCE-POSTMERGE-032:RELEASED',
            'lease:coordination/execution-lease:TOKEN32:RELEASED_CAS',
            'lease-release-commit:a80ce20da1c8ee04afc80e2c289baf95d528ccac',
            'lease-release-blob:2018e55d78ad3c23063d565f41d9bd73ae94bf36',
            'qualification:repo-guard-35218123802:PASS',
            'pr:472:TERMINAL_RECOVERY_CANDIDATE'
          ]
          d['source_refs']=list(dict.fromkeys(refs))

          for key in ('relevant_paths','state_refs','survival_paths'):
              vals=d.get(key,[])
              if not isinstance(vals,list):
                  vals=[]
              vals=[complete_hb if v==active_hb else v for v in vals]
              for v in [complete_hb,iteration,'docs/state/v2/events/EVT-20260917T115600Z-CONVERGENCE-TOKEN32-CLAIM-RELEASED.json']:
                  if v not in vals and (key!='survival_paths' or v==complete_hb):
                      vals.append(v)
              d[key]=list(dict.fromkeys(vals))

          g=d.setdefault('graph',{})
          for node in g.get('nodes',[]):
              if node.get('id')=='C:CLAIM-CONVERGENCE-POSTMERGE-032':
                  node['state']='RELEASED_TOKEN_32_KEEP'
              elif node.get('id')=='L:GLOBAL-EXECUTION-LEASE-032':
                  node['state']='RELEASED_CAS'
              elif node.get('id')=='PR:472':
                  node['state']='TOKEN32_TERMINAL_RESEALED_AWAITING_FINAL_GAUNTLET'
          p.write_text(json.dumps(d,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n')

          p=Path('docs/state/NEXT.json')
          n=json.loads(p.read_text())
          n['generated_at']='2026-09-17T11:58:00Z'
          n['active_claim']=None
          n['execution_mode']='RECOVERY_RECONCILE'
          n['successor_execution_allowed']=False
          n['convergence_route']='CONVERGENCE_TOKEN32_RELEASED_AWAITING_FINAL_ZERO_WRITER_GAUNTLET'
          n['exact_dependency']='Claim32 and its external CAS lease are both terminal RELEASED; no successor writer is authorized while PR472 awaits final zero-writer qualification and the existing owner/platform promotion gate.'
          n['hard_blockers']=[
            'FINAL_ZERO_WRITER_GAUNTLET_REQUIRED_FOR_PR_472',
            'OWNER_PLATFORM_PROMOTION_GATE_REQUIRED_FOR_PR_472',
            'PLATFORM_ENFORCEMENT_REQUIRED_NOT_YET_ENFORCED_ISSUE_441',
            'RECONCILE_REQUIRED_1403_NOT_ZERO',
            'GOAL_DRAIN_BLOCKS_B12_AUTOMATIC_EXECUTION',
            'OUTBOUND_CLOSED'
          ]
          n['next_safe_actions']=[
            'Verify terminal projections show zero active writers and fencing high-watermark32.',
            'Run final exact-head terminal-state gauntlet.',
            'Re-read live main for relevant-scope drift.',
            'Stop at owner/platform promotion gate; do not start outbound.'
          ]
          n.setdefault('safety',{}).update({'authority_advanced':False,'h_id_allocations':0,'canonical_id_reservations':0,'crm_universe_complete':False,'outbound':'CLOSED','send_allowed':0,'irreversible_external_actions':0})
          p.write_text(json.dumps(n,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          PY
      - name: Materialize terminal Runtime Graph
        run: |
          AS_OF=$(python - <<'PY'
          import json
          from pathlib import Path
          vals=[]
          for p in Path('docs/state/agent-runtime/heartbeats').glob('*.json'):
              d=json.loads(p.read_text())
              v=d.get('observed_at')
              if isinstance(v,str) and v:
                  vals.append(v)
          print(max(vals))
          PY
          )
          python scripts/rebuild_agent_runtime_graph.py --as-of "$AS_OF" --output docs/state/agent-runtime/runtime-graph.json
          python scripts/rebuild_agent_runtime_graph.py --check
      - name: Materialize terminal V2 coordination and Context Survival
        run: |
          rm -rf /tmp/v2-token32-terminal /tmp/v2-token32-terminal-check
          python scripts/rebuild_v2_coordination.py --config docs/refactor-v2/coordination_current_config.json --output-dir /tmp/v2-token32-terminal
          cp /tmp/v2-token32-terminal/active-claims.json docs/state/v2/active-claims.json
          cp /tmp/v2-token32-terminal/project-state.json docs/state/v2/project-state.json
          cp /tmp/v2-token32-terminal/context-pack.json docs/state/v2/context-pack.json
          cp /tmp/v2-token32-terminal/graph-snapshot.json docs/state/v2/graph-snapshot.json
          cp /tmp/v2-token32-terminal/CONTEXT_SURVIVAL.json docs/continuity/CONTEXT_SURVIVAL.json
          python scripts/rebuild_v2_coordination.py --config docs/refactor-v2/coordination_current_config.json --output-dir /tmp/v2-token32-terminal-check --check
      - name: Assert zero-writer terminal state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          n=json.loads(Path('docs/state/NEXT.json').read_text())
          a=json.loads(Path('docs/state/v2/active-claims.json').read_text())
          p=json.loads(Path('docs/state/v2/project-state.json').read_text())
          r=json.loads(Path('docs/state/agent-runtime/runtime-graph.json').read_text())
          assert a['claims']==[]
          assert a['collisions']==[]
          assert a['fencing_high_watermark']==32
          assert p['active_claim_ids']==[]
          assert r['active_sessions']==[]
          assert n['active_claim'] is None
          assert n['successor_execution_allowed'] is False
          assert n['safety']['authority_advanced'] is False
          assert n['safety']['h_id_allocations']==0
          assert n['safety']['outbound']=='CLOSED'
          assert n['safety']['send_allowed']==0
          PY
      - name: Commit exact terminal projections
        run: |
          git add docs/refactor-v2/coordination_current_config.json docs/state/NEXT.json docs/state/agent-runtime/runtime-graph.json docs/state/v2/active-claims.json docs/state/v2/project-state.json docs/state/v2/context-pack.json docs/state/v2/graph-snapshot.json docs/continuity/CONTEXT_SURVIVAL.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'coordination: materialize token32 terminal zero-writer state'
          git push origin HEAD:convergence/postmerge-recovery-token32-20260917

name: full-market-detail-enrich

on:
  push:
    branches:
      - market/full-universe-crawler
    paths:
      - "ops/full_market_detail_run.json"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful full-market-crawl run ID"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: full-market-detail-enrich-${{ github.ref }}
  cancel-in-progress: true

jobs:
  details:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Resolve source run
        id: source
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN_ID="${{ inputs.source_run_id }}"
          else
            RUN_ID=$(python - <<'PY'
          import json
          print(json.load(open('ops/full_market_detail_run.json'))['source_run_id'])
          PY
          )
          fi
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download discovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          RUN_ID="${{ steps.source.outputs.run_id }}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$API" > artifacts.json
          ARTIFACT_ID=$(python - <<'PY'
          import json
          x=json.load(open('artifacts.json'))
          hits=[a for a in x.get('artifacts',[]) if a.get('name')=='swiss-full-market-discovery' and not a.get('expired')]
          if not hits: raise SystemExit('swiss-full-market-discovery artifact not found')
          print(hits[0]['id'])
          PY
          )
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o discovery.zip
          mkdir -p source
          unzip -q discovery.zip -d source
          test -s source/hotelleriesuisse_universe_discovery.csv

      - name: Enrich official details
        run: |
          mkdir -p detail
          python scripts/enrich_hotelleriesuisse_details.py \
            --input source/hotelleriesuisse_universe_discovery.csv \
            --out detail \
            --shard-index ${{ matrix.shard }} \
            --shard-count 4 \
            --delay 1.5

      - name: Upload detail shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swiss-full-market-details-${{ matrix.shard }}
          path: detail/
          if-no-files-found: warn
          retention-days: 30

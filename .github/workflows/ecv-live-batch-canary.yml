name: ecv-live-batch-canary

on:
  workflow_dispatch:
  push:
    branches:
      - source/ecv-batch-0001-sub0002-20260828

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact-current work subbatch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          PYTHONPATH=src python -m swiss_os.exact_current_verify verify \
            docs/state/CMI_WORK_BATCH_0001_SUB0002_33206402141.json \
            --out .artifacts/ECV_BATCH_0001_SUB0002.json \
            --delay 0.35 \
            --timeout 30 \
            --attempts 3 \
            > .artifacts/ECV_RUNTIME.json
          PYTHONPATH=src python -m swiss_os.exact_current_verify validate \
            .artifacts/ECV_BATCH_0001_SUB0002.json \
            > .artifacts/ECV_VALIDATE.json
      - name: Safety assertions
        shell: bash
        run: |
          python - <<'PY'
          import json
          p=json.load(open('.artifacts/ECV_BATCH_0001_SUB0002.json'))
          assert p['authority_advanced'] is False
          assert p['h_id_allocations'] == 0 and type(p['h_id_allocations']) is int
          assert p['outbound'] == 'CLOSED'
          assert p['send_allowed'] == 0 and type(p['send_allowed']) is int
          assert p['items_count'] == 20 == p['results_count']
          print(json.dumps({'counts':p['counts_by_state'],'all_verified':p['all_verified'],'packet_sha256':p['packet_sha256']},indent=2,sort_keys=True))
          PY
      - name: Upload ECV evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecv-batch-0001-sub0002-evidence
          path: .artifacts
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

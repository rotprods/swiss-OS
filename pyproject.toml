[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swiss-job-os"
version = "0.1.0"
description = "Executable integrity core for SWITZERLAND_JOB_OS"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
swiss-os = "swiss_os.cli:main"
graphify = "swiss_os.semantic_graph_cli:graphify_main"
cos-graph-engine = "swiss_os.semantic_graph_cli:cos_graph_main"

[tool.setuptools.packages.find]
where = ["src"]

name: repo-guard

on:
  push:
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Virtual PC repository export (temporary)
        uses: actions/upload-artifact@v4
        with:
          name: virtual-pc-repository-snapshot
          path: |
            .
            !**/.git/**
          include-hidden-files: true
          retention-days: 1
      - name: Pack Virtual PC git metadata (temporary)
        shell: bash
        run: tar -C "$GITHUB_WORKSPACE" -czf /tmp/virtual-pc-git-metadata.tar.gz .git
      - name: Upload Virtual PC git metadata (temporary)
        uses: actions/upload-artifact@v4
        with:
          name: virtual-pc-git-metadata
          path: /tmp/virtual-pc-git-metadata.tar.gz
          retention-days: 1
      - name: Build Virtual PC native semantic runtime (temporary)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          if ! curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
            nohup ollama serve >/tmp/ollama.log 2>&1 &
          fi
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen3-embedding:0.6b
          mkdir -p /tmp/semantic-runtime/bin /tmp/semantic-runtime/share
          cp "$(command -v ollama)" /tmp/semantic-runtime/bin/ollama
          MODELS_DIR="$(sudo find /usr/share /var/lib "$HOME" -type d -path '*/.ollama/models' -print -quit 2>/dev/null || true)"
          if [ -z "$MODELS_DIR" ]; then
            MODELS_DIR="$(sudo find / -type d -path '*/.ollama/models' -print -quit 2>/dev/null || true)"
          fi
          test -n "$MODELS_DIR"
          echo "ollama_models_dir=$MODELS_DIR"
          sudo cp -a "$MODELS_DIR" /tmp/semantic-runtime/share/ollama-models
          sudo chown -R "$(id -u):$(id -g)" /tmp/semantic-runtime/share/ollama-models
          curl -fL "https://github.com/qdrant/qdrant/releases/download/v1.19.0/qdrant-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/qdrant.tgz
          tar -xzf /tmp/qdrant.tgz -C /tmp/semantic-runtime/bin qdrant
          chmod +x /tmp/semantic-runtime/bin/ollama /tmp/semantic-runtime/bin/qdrant
          {
            echo "ollama_model=qwen3-embedding:0.6b"
            echo "qdrant_version=v1.19.0"
            echo "runner_arch=$(uname -m)"
            echo "source_models_dir=$MODELS_DIR"
            sha256sum /tmp/semantic-runtime/bin/ollama /tmp/semantic-runtime/bin/qdrant
          } > /tmp/semantic-runtime/RUNTIME_MANIFEST.txt
          tar -C /tmp/semantic-runtime -czf /tmp/semantic-runtime-linux-x86_64.tar.gz .
          sha256sum /tmp/semantic-runtime-linux-x86_64.tar.gz > /tmp/semantic-runtime-linux-x86_64.tar.gz.sha256
          split -b 230M -d -a 1 /tmp/semantic-runtime-linux-x86_64.tar.gz /tmp/semantic-runtime.tar.gz.part-
          test -f /tmp/semantic-runtime.tar.gz.part-0
          test -f /tmp/semantic-runtime.tar.gz.part-1
          test -f /tmp/semantic-runtime.tar.gz.part-2
      - name: Upload Virtual PC semantic runtime part 0 (temporary)
        uses: actions/upload-artifact@v4
        with:
          name: virtual-pc-semantic-runtime-part-0
          path: /tmp/semantic-runtime.tar.gz.part-0
          retention-days: 1
      - name: Upload Virtual PC semantic runtime part 1 (temporary)
        uses: actions/upload-artifact@v4
        with:
          name: virtual-pc-semantic-runtime-part-1
          path: /tmp/semantic-runtime.tar.gz.part-1
          retention-days: 1
      - name: Upload Virtual PC semantic runtime part 2 (temporary)
        uses: actions/upload-artifact@v4
        with:
          name: virtual-pc-semantic-runtime-part-2
          path: /tmp/semantic-runtime.tar.gz.part-2
          retention-days: 1
      - name: Upload Virtual PC semantic runtime checksum (temporary)
        uses: actions/upload-artifact@v4
        with:
          name: virtual-pc-semantic-runtime-checksum
          path: /tmp/semantic-runtime-linux-x86_64.tar.gz.sha256
          retention-days: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Public repository guard
        run: python scripts/repo_guard.py
      - name: Stable contract drift guard
        run: python scripts/system_contract_guard.py
      - name: Agent improvement / GRAPH-REFACTOR-V2 guard
        run: python scripts/agent_improvement_guard.py
      - name: Deterministic V2 coordination rebuild guard
        run: python scripts/rebuild_v2_coordination.py --config docs/refactor-v2/coordination_current_config.json --output-dir /tmp/v2-coordination-rebuild --check
      - name: V2 coordination contract guard
        run: python scripts/v2_contract_guard.py
      - name: V2 forward event contract guard
        run: python scripts/v2_forward_event_guard.py
      - name: Context survival / compaction checkpoint guard
        run: python scripts/context_survival_guard.py
      - name: V2 empirical recovery and death drill
        run: python scripts/v2_empirical_drill.py --receipt /tmp/v2-empirical-receipt.json
      - name: CWP candidate lineage guard
        run: python -m swiss_os.cwp_lineage_guard
      - name: Durable handoff frontier guard
        run: python scripts/handoff_frontier_guard.py
      - name: Semantic graph static benchmark
        run: python -m swiss_os.semantic_graph_cli graphify scan --repo . --graph-out /tmp/swiss-os-graph.jsonl --manifest-out /tmp/swiss-os-graph-manifest.json
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Manifest semantics canary
        run: python -m swiss_os.cli manifest validate tests/fixtures/manifest_superseded.json

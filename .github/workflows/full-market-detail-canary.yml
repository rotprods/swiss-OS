name: full-market-detail-canary

on:
  push:
    branches: [market/full-universe-crawler]
    paths: [ops/full_market_detail_canary.json]

permissions:
  actions: read
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - id: cfg
        run: |
          RUN_ID=$(python - <<'PY'
          import json
          print(json.load(open('ops/full_market_detail_canary.json'))['source_run_id'])
          PY
          )
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Download discovery artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${{ steps.cfg.outputs.run_id }}/artifacts" > artifacts.json
          ARTIFACT_ID=$(python - <<'PY'
          import json
          x=json.load(open('artifacts.json'))
          hits=[a for a in x['artifacts'] if a['name']=='swiss-full-market-discovery' and not a['expired']]
          if not hits: raise SystemExit('discovery artifact not found')
          print(hits[0]['id'])
          PY
          )
          curl -L --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" -o discovery.zip
          mkdir source && unzip -q discovery.zip -d source
      - name: Run 24-row source canary
        run: |
          mkdir detail
          python scripts/enrich_hotelleriesuisse_details.py \
            --input source/hotelleriesuisse_universe_discovery.csv \
            --out detail --shard-index 0 --shard-count 1 --limit 24 --delay 1.2
      - uses: actions/upload-artifact@v4
        with:
          name: swiss-full-market-detail-canary
          path: detail/
          retention-days: 7

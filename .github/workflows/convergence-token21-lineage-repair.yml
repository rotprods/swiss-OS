name: convergence-token21-lineage-repair

on:
  push:
    branches:
      - convergence/main-singularity
    paths:
      - .github/workflows/convergence-token21-lineage-repair.yml

permissions:
  contents: write

concurrency:
  group: convergence-token21-lineage-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify exact global token21 lease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/wave_lease_guard.py status > /tmp/lease-status.json
          python -c "import json; d=json.load(open('/tmp/lease-status.json')); a=d.get('active_lease') or {}; assert d['fencing_high_watermark']==21; assert d['expired'] is False; assert a['lease_id']=='LEASE-0479ab715ce626b5422f'; assert a['fencing_token']==21; assert a['session_id']=='SES-20260912T203915Z-CONVERGENCE-021'; assert a['run_id']=='RUN-20260912-203915-lineage-repair'; assert a['parent_main_sha']=='3c902a791be0e8df1db564034e211ea90c41f1b3'; assert a['authority_epoch']=='HS_ENTITY_EPOCH_2026-08-25_E4'; assert a['state']=='ACTIVE' and a['mutation_allowed'] is True"
      - name: Apply bounded token21 repair
        run: python .github/scripts/token21_lineage_repair.py
      - name: Rebuild active Runtime Graph and V2 projections
        run: |
          set -euo pipefail
          AS_OF=$(python -c "import json,pathlib; v=[json.loads(p.read_text()).get('observed_at') for p in pathlib.Path('docs/state/agent-runtime/heartbeats').glob('*.json')]; print(max(x for x in v if isinstance(x,str) and x))")
          python scripts/rebuild_agent_runtime_graph.py --as-of "$AS_OF" --output docs/state/agent-runtime/runtime-graph.json
          rm -rf /tmp/v2-token21
          python scripts/rebuild_v2_coordination.py --config docs/refactor-v2/coordination_current_config.json --output-dir /tmp/v2-token21
          cp /tmp/v2-token21/active-claims.json docs/state/v2/active-claims.json
          cp /tmp/v2-token21/project-state.json docs/state/v2/project-state.json
          cp /tmp/v2-token21/context-pack.json docs/state/v2/context-pack.json
          cp /tmp/v2-token21/graph-snapshot.json docs/state/v2/graph-snapshot.json
          cp /tmp/v2-token21/CONTEXT_SURVIVAL.json docs/continuity/CONTEXT_SURVIVAL.json
      - name: Adversarial tests and live guards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_HEAD_REF: convergence/main-singularity
          GITHUB_EVENT_NAME: pull_request
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_material_mutation_lineage.py' -v
          CHANGED=$({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          export GRAPH_V2_CHANGED_PATHS="$CHANGED"
          python scripts/material_mutation_lineage_guard.py
          python scripts/execution_lease_live_guard.py
          python scripts/rebuild_agent_runtime_graph.py --check
          rm -rf /tmp/v2-token21-check
          python scripts/rebuild_v2_coordination.py --config docs/refactor-v2/coordination_current_config.json --output-dir /tmp/v2-token21-check --check
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Commit coherent token21 active repair
        run: |
          set -euo pipefail
          git add scripts/material_mutation_lineage_guard.py tests/test_material_mutation_lineage.py docs/state/v2/claims/CLAIM-CONVERGENCE-LINEAGE-021.json docs/state/v2/events/EVT-20260912T203915Z-CONVERGENCE-TOKEN21-ACQUIRED.json docs/state/agent-runtime/heartbeats/HB-AGENT-GPT56SOL-CONVERGENCE-021-INIT.json docs/refactor-v2/coordination_current_config.json docs/state/NEXT.json docs/state/NEXT_CONVERGENCE_ONLY_2026-09-12.json docs/state/v2/NEXT_CONVERGENCE_ONLY_2026-09-12.json docs/state/agent-runtime/runtime-graph.json docs/state/v2/active-claims.json docs/state/v2/project-state.json docs/state/v2/context-pack.json docs/state/v2/graph-snapshot.json docs/continuity/CONTEXT_SURVIVAL.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(coordination): repair terminal lineage succession under token21'
          git push origin HEAD:convergence/main-singularity

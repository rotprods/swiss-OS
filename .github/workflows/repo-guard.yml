name: repo-guard

on:
  push:
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Virtual PC repository export (temporary)
        uses: actions/upload-artifact@v4
        with:
          name: virtual-pc-repository-snapshot
          path: |
            .
            !**/.git/**
          include-hidden-files: true
          retention-days: 1
      - name: Pack Virtual PC git metadata (temporary)
        shell: bash
        run: tar -C "$GITHUB_WORKSPACE" -czf /tmp/virtual-pc-git-metadata.tar.gz .git
      - name: Upload Virtual PC git metadata (temporary)
        uses: actions/upload-artifact@v4
        with:
          name: virtual-pc-git-metadata
          path: /tmp/virtual-pc-git-metadata.tar.gz
          retention-days: 1
      - name: Build CPU-only Ollama + Qdrant transport (temporary)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          if ! curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
            nohup ollama serve >/tmp/ollama.log 2>&1 &
          fi
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen3-embedding:0.6b
          curl -fsS http://127.0.0.1:11434/api/embed \
            -H 'Content-Type: application/json' \
            -d '{"model":"qwen3-embedding:0.6b","input":["SWISS-OS portable CPU runtime qualification"],"truncate":false}' \
            >/tmp/embed-smoke.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/embed-smoke.json'))
          v=p['embeddings'][0]
          assert len(v) > 0
          print('embedding_dimension=',len(v))
          PY

          OLLAMA_BIN="$(command -v ollama)"
          OLLAMA_LIB=""
          for d in /usr/local/lib/ollama /usr/lib/ollama; do
            if [ -d "$d" ]; then OLLAMA_LIB="$d"; break; fi
          done
          test -n "$OLLAMA_LIB"
          echo "ollama_bin=$OLLAMA_BIN"
          echo "ollama_lib=$OLLAMA_LIB"
          echo '== installed ollama library inventory =='
          find "$OLLAMA_LIB" -type f -printf '%P %s\n' | sort -k2nr | head -100

          rm -rf /tmp/ollama-cpu-root
          mkdir -p /tmp/ollama-cpu-root/usr/local/bin /tmp/ollama-cpu-root/usr/local/lib/ollama
          cp "$OLLAMA_BIN" /tmp/ollama-cpu-root/usr/local/bin/ollama
          python - "$OLLAMA_LIB" <<'PY'
          import os, pathlib, shutil, sys
          src=pathlib.Path(sys.argv[1])
          dst=pathlib.Path('/tmp/ollama-cpu-root/usr/local/lib/ollama')
          deny=('cuda','rocm','hip','vulkan','metal','mlx','jetpack','sycl','oneapi')
          copied=[]
          for p in src.rglob('*'):
              if not p.is_file():
                  continue
              rel=p.relative_to(src)
              low='/'.join(rel.parts).lower()
              if any(x in low for x in deny):
                  continue
              out=dst/rel
              out.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(p,out)
              copied.append((str(rel),p.stat().st_size))
          assert copied
          print('cpu_files=',len(copied),'cpu_bytes=',sum(s for _,s in copied))
          for rel,size in sorted(copied,key=lambda x:x[1],reverse=True)[:80]:
              print(rel,size)
          PY

          curl -fL "https://github.com/qdrant/qdrant/releases/download/v1.19.0/qdrant-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/qdrant.tgz
          mkdir -p /tmp/qdrant-root/usr/local/bin
          tar -xzf /tmp/qdrant.tgz -C /tmp/qdrant-root/usr/local/bin qdrant
          chmod +x /tmp/qdrant-root/usr/local/bin/qdrant

          tar -C /tmp/ollama-cpu-root -czf /tmp/ollama-cpu-root.tar.gz .
          tar -C /tmp/qdrant-root -czf /tmp/qdrant-root.tar.gz .
          sha256sum /tmp/ollama-cpu-root.tar.gz /tmp/qdrant-root.tar.gz > /tmp/virtual-pc-runtime.sha256
          split -b 230M -d -a 1 /tmp/ollama-cpu-root.tar.gz /tmp/ollama-cpu-root.tar.gz.part-
          for n in 0 1 2 3; do test -f "/tmp/ollama-cpu-root.tar.gz.part-$n" || : > "/tmp/ollama-cpu-root.tar.gz.part-$n"; done
          test ! -f /tmp/ollama-cpu-root.tar.gz.part-4
          ls -lh /tmp/ollama-cpu-root.tar.gz /tmp/ollama-cpu-root.tar.gz.part-* /tmp/qdrant-root.tar.gz
      - name: Upload Ollama CPU part 0 (temporary)
        uses: actions/upload-artifact@v4
        with:
          name: virtual-pc-ollama-cpu-part-0
          path: /tmp/ollama-cpu-root.tar.gz.part-0
          retention-days: 1
      - name: Upload Ollama CPU part 1 (temporary)
        uses: actions/upload-artifact@v4
        with:
          name: virtual-pc-ollama-cpu-part-1
          path: /tmp/ollama-cpu-root.tar.gz.part-1
          retention-days: 1
      - name: Upload Ollama CPU part 2 (temporary)
        uses: actions/upload-artifact@v4
        with:
          name: virtual-pc-ollama-cpu-part-2
          path: /tmp/ollama-cpu-root.tar.gz.part-2
          retention-days: 1
      - name: Upload Ollama CPU part 3 (temporary)
        uses: actions/upload-artifact@v4
        with:
          name: virtual-pc-ollama-cpu-part-3
          path: /tmp/ollama-cpu-root.tar.gz.part-3
          retention-days: 1
      - name: Upload Qdrant runtime (temporary)
        uses: actions/upload-artifact@v4
        with:
          name: virtual-pc-qdrant-runtime
          path: /tmp/qdrant-root.tar.gz
          retention-days: 1
      - name: Upload runtime checksums (temporary)
        uses: actions/upload-artifact@v4
        with:
          name: virtual-pc-runtime-checksums
          path: /tmp/virtual-pc-runtime.sha256
          retention-days: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Public repository guard
        run: python scripts/repo_guard.py
      - name: Stable contract drift guard
        run: python scripts/system_contract_guard.py
      - name: Agent improvement / GRAPH-REFACTOR-V2 guard
        run: python scripts/agent_improvement_guard.py
      - name: Deterministic V2 coordination rebuild guard
        run: python scripts/rebuild_v2_coordination.py --config docs/refactor-v2/coordination_current_config.json --output-dir /tmp/v2-coordination-rebuild --check
      - name: V2 coordination contract guard
        run: python scripts/v2_contract_guard.py
      - name: V2 forward event contract guard
        run: python scripts/v2_forward_event_guard.py
      - name: Context survival / compaction checkpoint guard
        run: python scripts/context_survival_guard.py
      - name: V2 empirical recovery and death drill
        run: python scripts/v2_empirical_drill.py --receipt /tmp/v2-empirical-receipt.json
      - name: CWP candidate lineage guard
        run: python -m swiss_os.cwp_lineage_guard
      - name: Durable handoff frontier guard
        run: python scripts/handoff_frontier_guard.py
      - name: Semantic graph static benchmark
        run: python -m swiss_os.semantic_graph_cli graphify scan --repo . --graph-out /tmp/swiss-os-graph.jsonl --manifest-out /tmp/swiss-os-graph-manifest.json
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Manifest semantics canary
        run: python -m swiss_os.cli manifest validate tests/fixtures/manifest_superseded.json

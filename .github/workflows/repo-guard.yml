name: repo-guard

on:
  push:
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Public repository guard
        run: python scripts/repo_guard.py
      - name: Compile operational scripts
        run: python -m py_compile scripts/*.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Manifest semantics canary
        run: python -m swiss_os.cli manifest validate tests/fixtures/manifest_superseded.json
